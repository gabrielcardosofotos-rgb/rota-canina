<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rota Canina — Painel do Passeador</title>
<meta name="theme-color" content="#2F4B3C">
<link rel="manifest" href='data:application/manifest+json,{"name":"Rota Canina — Painel do Passeador","short_name":"Rota Canina","start_url":".","display":"standalone","background_color":"%23EDEAE2","theme_color":"%232F4B3C","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%232F4B3C%27/%3E%3Ccircle cx=%2750%27 cy=%2758%27 r=%2718%27 fill=%27%23EDEAE2%27/%3E%3Ccircle cx=%2730%27 cy=%2732%27 r=%278.5%27 fill=%27%23EDEAE2%27/%3E%3Ccircle cx=%2770%27 cy=%2732%27 r=%278.5%27 fill=%27%23EDEAE2%27/%3E%3Ccircle cx=%2718%27 cy=%2750%27 r=%277%27 fill=%27%23EDEAE2%27/%3E%3Ccircle cx=%2782%27 cy=%2750%27 r=%277%27 fill=%27%23EDEAE2%27/%3E%3C/svg%3E","sizes":"any","type":"image/svg+xml"}]}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEAE2;
    --surface:#FFFFFF;
    --surface-alt:#F7F5EF;
    --ink:#22281F;
    --ink-soft:#5B6358;
    --pine:#2F4B3C;
    --pine-dark:#1E3226;
    --ochre:#B8863B;
    --ochre-soft:#EADFC7;
    --line:#DAD5C8;
    --line-strong:#C7C0AE;
    --danger:#A24B3E;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  h1,h2,h3{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    margin:0 0 4px 0;
    letter-spacing:-0.01em;
  }
  #app, #client-app{
    max-width:520px;
    margin:0 auto;
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .topbar{
    padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 14px 20px;
    background:var(--bg);
    position:sticky;
    top:0;
    z-index:5;
  }
  .topbar .brand{font-size:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ochre);margin-bottom:4px;}
  .topbar h1{font-size:34px;font-style:italic;color:var(--pine-dark);}
  .topbar .sub{font-size:14px;color:var(--ink-soft);}
  main.view{
    flex:1;
    overflow-y:auto;
    padding:4px 20px 100px 20px;
    display:none;
  }
  main.view.active{display:block;}

  /* Empty states */
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:34px;display:block;margin-bottom:10px;opacity:.7;}
  .empty-state p{margin:0;font-size:15px;line-height:1.5;}

  /* Agenda */
  .day-group{margin-bottom:26px;}
  .day-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  .day-head .label{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15px;
    color:var(--pine-dark);
    white-space:nowrap;
  }
  .day-head .rule{
    flex:1;
    height:0;
    border-top:2px dashed var(--ochre);
    opacity:.55;
  }
  .walks-list{
    list-style:none;
    margin:0;
    padding-left:20px;
    border-left:2px dashed var(--line-strong);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .walk-card{
    position:relative;
    background:var(--surface);
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:0 1px 2px rgba(34,40,31,0.06);
  }
  .walk-card::before{
    content:'';
    position:absolute;
    left:-26px;
    top:20px;
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--pine);
    border:3px solid var(--bg);
  }
  .walk-card.status-concluido::before{background:var(--ochre);}
  .walk-card.status-cancelado{opacity:.5;}
  .walk-card.status-cancelado::before{background:var(--line-strong);}
  .walk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .walk-time{font-family:'Fraunces',serif;font-weight:600;font-size:20px;color:var(--pine-dark);}
  .walk-dog{font-size:16px;font-weight:600;margin-top:2px;}
  .walk-client{font-size:14px;color:var(--ink-soft);margin-top:1px;}
  .status-pill{
    font-size:13px;
    padding:3px 9px;
    border-radius:99px;
    background:var(--surface-alt);
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .status-pill.concluido{background:var(--ochre-soft);color:#7A5A22;}

  /* Clients */
  .client-card{
    background:var(--surface);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(34,40,31,0.06);
  }
  .client-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    cursor:pointer;
  }
  .client-name{font-family:'Fraunces',serif;font-weight:600;font-size:16px;}
  .client-sub{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .dog-badge{
    font-size:13px;
    background:var(--surface-alt);
    color:var(--pine-dark);
    padding:4px 10px;
    border-radius:99px;
    white-space:nowrap;
  }
  .client-dogs{
    padding:0 16px 16px 16px;
    border-top:1px solid var(--line);
  }
  .client-dogs[hidden]{display:none;}
  .client-info{padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:4px;}
  .info-row{font-size:15px;color:var(--ink);display:flex;align-items:flex-start;gap:6px;margin-bottom:6px;}
  .info-row:last-child{margin-bottom:0;}
  .addr-link{color:var(--pine-dark);text-decoration:underline;text-decoration-color:var(--ochre);font-weight:500;}
  .addr-list{
    position:absolute;
    top:100%;left:0;right:0;
    margin:4px 0 0 0;
    padding:0;
    list-style:none;
    background:var(--surface);
    border:1px solid var(--line-strong);
    border-radius:10px;
    max-height:220px;
    overflow-y:auto;
    z-index:30;
    box-shadow:0 6px 16px rgba(34,40,31,0.12);
  }
  .addr-list[hidden]{display:none;}
  .addr-list li{
    padding:10px 12px;
    font-size:13px;
    line-height:1.35;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .addr-list li:last-child{border-bottom:none;}
  .addr-list li:active{background:var(--surface-alt);}
  .dog-chip{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .dog-chip:last-of-type{border-bottom:none;}
  .dog-chip .dog-meta{color:var(--ink-soft);font-size:13px;margin-top:2px;}
  .dog-chip .dog-actions button{font-size:13px;}
  .client-actions, .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:14px;
  }

  /* Buttons */
  button{font-family:inherit;}
  .btn-primary{
    width:100%;
    background:var(--pine);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-primary:active{background:var(--pine-dark);}
  .btn-secondary{
    flex:1;
    background:var(--surface-alt);
    color:var(--ink);
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-ghost{
    background:none;
    border:1px solid var(--line-strong);
    color:var(--ink);
    border-radius:99px;
    padding:8px 14px;
    font-size:13px;
    cursor:pointer;
  }
  .btn-ghost.danger{color:var(--danger);border-color:#E3C7C1;}

  /* Bottom nav + FAB */
  .bottomnav{
    display:flex;
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px) 12px;
    position:relative;
    z-index:5;
  }
  .bottomnav button{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:6px;
    font-size:12px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .bottomnav button .ic{font-size:19px;}
  .bottomnav button.active{color:var(--pine-dark);font-weight:600;}
  .fab{
    position:absolute;
    right:20px;
    bottom:78px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--ochre);
    color:#fff;
    border:none;
    font-size:28px;
    line-height:1;
    box-shadow:0 4px 12px rgba(184,134,59,0.4);
    cursor:pointer;
    z-index:6;
  }
  .fab:active{transform:scale(0.96);}

  /* Sheet */
  .sheet-overlay{
    position:fixed;
    inset:0;
    background:rgba(20,24,17,0.45);
    display:flex;
    align-items:flex-end;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
    z-index:20;
  }
  .sheet-overlay.open{opacity:1;pointer-events:auto;}
  .sheet{
    background:var(--bg);
    width:100%;
    max-width:520px;
    margin:0 auto;
    border-radius:22px 22px 0 0;
    padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 24px) 20px;
    max-height:88vh;
    overflow-y:auto;
    transform:translateY(100%);
    transition:transform .22s ease;
  }
  .sheet-overlay.open .sheet{transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){
    .sheet-overlay, .sheet{transition:none;}
  }
  .sheet-handle{
    width:36px;height:4px;background:var(--line-strong);
    border-radius:99px;margin:6px auto 14px auto;
  }
  .sheet label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin:14px 0 6px 0;
  }
  .sheet input[type=text],
  .sheet input[type=tel],
  .sheet input[type=date],
  .sheet input[type=time],
  .sheet input[type=number],
  .sheet select,
  .sheet textarea{
    width:100%;
    border:1px solid var(--line-strong);
    background:var(--surface);
    border-radius:10px;
    padding:12px;
    font-size:15px;
    color:var(--ink);
    font-family:inherit;
  }
  .sheet textarea{resize:vertical;min-height:64px;}
  .walk-photo{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin:8px 0;display:block;}
  .checkbox-row{
    display:flex !important;
    align-items:center;
    gap:8px;
    font-size:14px !important;
    font-weight:500 !important;
    color:var(--ink) !important;
  }
  .checkbox-row input{width:auto !important;}
  .field-error{color:var(--danger);font-size:13px;margin-top:4px;display:none;}
  .field-error.show{display:block;}
  .hint{font-size:13px;color:var(--ink-soft);margin-top:4px;}

  /* Auth gate */
  .auth-gate{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .auth-card{
    width:100%;
    max-width:360px;
    background:var(--surface);
    border-radius:20px;
    padding:28px 24px;
    box-shadow:0 4px 16px rgba(34,40,31,0.08);
  }
  .auth-card .brand{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ochre);margin-bottom:6px;}
  .auth-card h1{font-size:24px;font-style:italic;color:var(--pine-dark);margin-bottom:16px;}
  .auth-card label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:14px 0 6px 0;}
  .auth-card input{
    width:100%;border:1px solid var(--line-strong);background:var(--bg);
    border-radius:10px;padding:12px;font-size:15px;color:var(--ink);font-family:inherit;
  }
  .topbar-row{display:flex;justify-content:space-between;align-items:center;}
  .logout-btn{background:none;border:none;color:var(--ink-soft);font-size:13px;text-decoration:underline;cursor:pointer;padding:0;}

  /* Splash */
  #splash{
    position:fixed;inset:0;
    background:var(--pine-dark);
    display:flex;align-items:center;justify-content:center;
    z-index:100;
    transition:opacity .4s ease;
  }
  #splash.fade-out{opacity:0;pointer-events:none;}
  .splash-inner{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    color:var(--bg);
    animation:splashPop .6s ease;
  }
  .splash-paw{color:var(--ochre);}
  .splash-name{
    font-family:'Fraunces',serif;font-style:italic;font-weight:600;
    font-size:28px;letter-spacing:.02em;
  }
  @keyframes splashPop{
    0%{opacity:0;transform:scale(.85);}
    100%{opacity:1;transform:scale(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .splash-inner{animation:none;}
  }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-inner">
    <svg class="splash-paw" viewBox="0 0 100 100" width="72" height="72" aria-hidden="true">
      <circle cx="50" cy="58" r="18" fill="currentColor"/>
      <circle cx="30" cy="32" r="8.5" fill="currentColor"/>
      <circle cx="70" cy="32" r="8.5" fill="currentColor"/>
      <circle cx="18" cy="50" r="7" fill="currentColor"/>
      <circle cx="82" cy="50" r="7" fill="currentColor"/>
    </svg>
    <div class="splash-name">Rota Canina</div>
  </div>
</div>

<div id="auth-gate" class="auth-gate">
  <div class="auth-card">
    <div class="brand">Rota Canina</div>
    <h1 id="auth-title">Entrar</h1>
    <div class="field-error" id="auth-error"></div>
    <label>E-mail</label>
    <input type="email" id="auth-email" autocomplete="email">
    <label>Senha</label>
    <input type="password" id="auth-password" autocomplete="current-password">
    <div class="sheet-actions" style="flex-direction:column;">
      <button class="btn-primary" id="auth-submit">Entrar</button>
      <button class="btn-ghost" id="auth-toggle" style="width:100%;">Ainda não tenho conta</button>
    </div>
  </div>
</div>

<div id="app" style="display:none;">

  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">Rota Canina</div>
      <button class="logout-btn" id="logout-btn">Sair</button>
    </div>
    <h1 id="topbar-title">Agenda</h1>
    <div class="sub" id="topbar-sub"></div>
  </div>

  <main class="view active" id="view-agenda"></main>
  <main class="view" id="view-clientes"></main>
  <main class="view" id="view-planos"></main>

  <button class="fab" id="fab" aria-label="Adicionar">+</button>

  <nav class="bottomnav">
    <button data-view="agenda" class="active">
      <span class="ic">🗓️</span>Agenda
    </button>
    <button data-view="clientes">
      <span class="ic">🐾</span>Clientes
    </button>
    <button data-view="planos">
      <span class="ic">💳</span>Planos
    </button>
  </nav>
</div>

<div id="client-app" style="display:none;">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">Rota Canina</div>
      <button class="logout-btn" id="client-logout-btn">Sair</button>
    </div>
    <h1 id="client-title">Seu painel</h1>
    <div class="sub">Acompanhamento do passeio</div>
  </div>
  <main class="view active" id="client-content"></main>
</div>

<div class="sheet-overlay" id="sheet-overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
import { getFirestore, collection, doc, addDoc, getDocs, updateDoc, deleteDoc, query, where } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyAb_rhPbFxSt46uU9JXeEc-GMfVdTzCK6U",
  authDomain: "rota-canina-b8c59.firebaseapp.com",
  projectId: "rota-canina-b8c59",
  storageBucket: "rota-canina-b8c59.firebasestorage.app",
  messagingSenderId: "101127630560",
  appId: "1:101127630560:web:a520180844905d4f7b6a85"
};
const fbApp = initializeApp(firebaseConfig);
const fbAuth = getAuth(fbApp);
const firestoreDb = getFirestore(fbApp);

(function(){
  "use strict";

  /* ---------- Firestore layer (dados na nuvem) ---------- */
  const ADMIN_UID = 'VUXMg2U6uNZLyQNhaDCc333kXoO2';
  function colRef(name){ return collection(firestoreDb, 'users', ADMIN_UID, name); }
  function docRef(name, id){ return doc(firestoreDb, 'users', ADMIN_UID, name, id); }

  const Clients = {
    add: async (data)=> (await addDoc(colRef('clients'), data)).id,
    put: async (data)=>{ const {id, ...rest} = data; await updateDoc(docRef('clients', id), rest); },
    all: async ()=>{ const snap = await getDocs(colRef('clients')); return snap.docs.map(d=>({id:d.id, ...d.data()})); },
    del: (id)=> deleteDoc(docRef('clients', id)),
  };
  const Dogs = {
    add: async (data)=> (await addDoc(colRef('dogs'), data)).id,
    put: async (data)=>{ const {id, ...rest} = data; await updateDoc(docRef('dogs', id), rest); },
    all: async ()=>{ const snap = await getDocs(colRef('dogs')); return snap.docs.map(d=>({id:d.id, ...d.data()})); },
    byClient: async (clientId)=>{
      const snap = await getDocs(query(colRef('dogs'), where('clientId','==',clientId)));
      return snap.docs.map(d=>({id:d.id, ...d.data()}));
    },
    del: (id)=> deleteDoc(docRef('dogs', id)),
  };
  const Walks = {
    add: async (data)=> (await addDoc(colRef('walks'), data)).id,
    put: async (data)=>{ const {id, ...rest} = data; await updateDoc(docRef('walks', id), rest); },
    all: async ()=>{ const snap = await getDocs(colRef('walks')); return snap.docs.map(d=>({id:d.id, ...d.data()})); },
    del: (id)=> deleteDoc(docRef('walks', id)),
  };
  const Planos = {
    add: async (data)=> (await addDoc(colRef('planos'), data)).id,
    put: async (data)=>{ const {id, ...rest} = data; await updateDoc(docRef('planos', id), rest); },
    all: async ()=>{ const snap = await getDocs(colRef('planos')); return snap.docs.map(d=>({id:d.id, ...d.data()})); },
    del: (id)=> deleteDoc(docRef('planos', id)),
  };

  /* ---------- Fotos (ficam só no celular; Storage na nuvem ainda não está ativo) ---------- */
  const PHOTO_DB_NAME = 'trilha_photos_db';
  let photoDb;
  function openPhotoDB(){
    return new Promise((resolve, reject)=>{
      const req = indexedDB.open(PHOTO_DB_NAME, 1);
      req.onupgradeneeded = (e)=>{
        const d = e.target.result;
        if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', {keyPath:'walkId'});
      };
      req.onsuccess = (e)=>{ photoDb = e.target.result; resolve(photoDb); };
      req.onerror = (e)=> reject(e.target.error);
    });
  }
  const Photos = {
    save: (walkId, blob)=> new Promise((res,rej)=>{
      const tx = photoDb.transaction('photos','readwrite').objectStore('photos').put({walkId, blob});
      tx.onsuccess = ()=> res(); tx.onerror = ()=> rej(tx.error);
    }),
    get: (walkId)=> new Promise((res,rej)=>{
      const req = photoDb.transaction('photos').objectStore('photos').get(walkId);
      req.onsuccess = ()=> res(req.result ? req.result.blob : null);
      req.onerror = ()=> rej(req.error);
    }),
  };

  async function deleteDogCascade(dogId){
    const walks = await Walks.all();
    for(const w of walks){ if(w.dogId === dogId) await Walks.del(w.id); }
    await Dogs.del(dogId);
  }
  async function deleteClientCascade(clientId){
    const dogs = await Dogs.byClient(clientId);
    for(const dgo of dogs){ await deleteDogCascade(dgo.id); }
    await Clients.del(clientId);
  }

  /* ---------- Helpers ---------- */
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function addDays(dateStr, n){
    const d = new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()+n);
    return d.toISOString().slice(0,10);
  }
  function dayLabel(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    const t = new Date(); t.setHours(0,0,0,0);
    const diff = Math.round((d - t) / 86400000);
    if(diff === 0) return 'Hoje';
    if(diff === 1) return 'Amanhã';
    const weekday = d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
    const day = d.getDate();
    const month = d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
    return `${weekday}, ${day} ${month}`;
  }
  function timeLabel(t){ return t; }
  function esc(str){
    return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function addressLink(c){
    if(!c || !c.endereco) return '';
    if(c.lat && c.lon) return `https://www.google.com/maps?q=${c.lat},${c.lon}`;
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.endereco)}`;
  }
  function whatsappLink(tel){
    if(!tel) return '';
    const digits = tel.replace(/\D/g,'');
    if(!digits) return '';
    const withCountry = digits.length <= 11 ? '55'+digits : digits;
    return `https://wa.me/${withCountry}`;
  }
  function debounce(fn, delay){
    let t;
    return (...args)=>{ clearTimeout(t); t = setTimeout(()=> fn(...args), delay); };
  }

  /* ---------- Google Places (New) — autocomplete de endereço ---------- */
  const GOOGLE_MAPS_KEY = 'AIzaSyB_rZOccdW4uWnk-uQhrwUDTTbrebYmvFc';
  let placesLibPromise = null;
  function loadGoogleMaps(){
    return new Promise((resolve, reject)=>{
      if(window.google && window.google.maps){ resolve(); return; }
      window.__gmapsReady = resolve;
      const s = document.createElement('script');
      s.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_KEY}&libraries=places&callback=__gmapsReady&loading=async`;
      s.async = true;
      s.onerror = ()=> reject(new Error('Falha ao carregar Google Maps'));
      document.head.appendChild(s);
    });
  }
  async function getPlacesLib(){
    if(!placesLibPromise){
      placesLibPromise = loadGoogleMaps().then(()=> google.maps.importLibrary('places'));
    }
    return placesLibPromise;
  }
  function setupAddressAutocomplete(input, list, latInput, lonInput, bairroInput){
    let sessionToken = null;
    const runSearch = debounce(async ()=>{
      const q = input.value.trim();
      if(q.length < 4){ list.hidden = true; list.innerHTML=''; return; }
      try{
        const { AutocompleteSuggestion, AutocompleteSessionToken } = await getPlacesLib();
        if(!sessionToken) sessionToken = new AutocompleteSessionToken();
        const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions({
          input: q,
          includedRegionCodes: ['br'],
          language: 'pt-BR',
          sessionToken
        });
        if(!suggestions || !suggestions.length){ list.hidden = true; list.innerHTML=''; return; }
        list._suggestions = suggestions;
        list.innerHTML = suggestions.map((s,i)=>`<li data-i="${i}">${esc(s.placePrediction.text.text)}</li>`).join('');
        list.hidden = false;
      }catch(e){
        console.error('Erro na busca de endereço (Google Places):', e);
        list.hidden = true;
      }
    }, 300);
    input.addEventListener('input', ()=>{
      latInput.value = ''; lonInput.value = '';
      runSearch();
    });
    input.addEventListener('blur', ()=>{ setTimeout(()=>{ list.hidden = true; }, 150); });
    list.addEventListener('click', async (e)=>{
      const li = e.target.closest('li');
      if(!li) return;
      const suggestion = list._suggestions[Number(li.dataset.i)];
      try{
        const place = suggestion.placePrediction.toPlace();
        await place.fetchFields({ fields: ['formattedAddress','location','addressComponents'] });
        input.value = place.formattedAddress || suggestion.placePrediction.text.text;
        latInput.value = place.location ? place.location.lat() : '';
        lonInput.value = place.location ? place.location.lng() : '';
        if(bairroInput && !bairroInput.value){
          const comp = (place.addressComponents || []).find(c =>
            c.types.includes('sublocality_level_1') || c.types.includes('sublocality') || c.types.includes('neighborhood')
          );
          if(comp) bairroInput.value = comp.longText;
        }
      }catch(err){
        console.error('Erro ao buscar detalhes do endereço:', err);
        input.value = suggestion.placePrediction.text.text;
      }
      list.hidden = true;
      sessionToken = null;
    });
  }

  /* ================= AGENDA ================= */
  async function renderAgenda(){
    const [walks, clients, dogs] = await Promise.all([Walks.all(), Clients.all(), Dogs.all()]);
    const clientMap = Object.fromEntries(clients.map(c=>[c.id,c]));
    const dogMap = Object.fromEntries(dogs.map(d=>[d.id,d]));
    const today = todayStr();
    const upcoming = walks
      .filter(w => w.status !== 'cancelado' && w.date >= today)
      .sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));

    if(upcoming.length === 0){
      views.agenda.innerHTML = `
        <div class="empty-state">
          <span class="glyph">🐾</span>
          <p>Nenhum passeio agendado ainda.<br>Toque em <strong>+</strong> para marcar o primeiro.</p>
        </div>`;
      return;
    }

    const byDate = {};
    upcoming.forEach(w=>{ (byDate[w.date] = byDate[w.date] || []).push(w); });

    let html = '';
    Object.keys(byDate).sort().forEach(date=>{
      html += `<div class="day-group">
        <div class="day-head"><span class="label">${dayLabel(date)}</span><span class="rule"></span></div>
        <ul class="walks-list">`;
      byDate[date].forEach(w=>{
        const dog = dogMap[w.dogId];
        const client = clientMap[w.clientId];
        const statusClass = w.status === 'concluido' ? 'status-concluido' : (w.status === 'cancelado' ? 'status-cancelado' : '');
        const pill = w.status === 'concluido' ? `<span class="status-pill concluido">Concluído${w.hasPhoto ? ' 📷' : ''}</span>` : '<span class="status-pill">Agendado</span>';
        html += `<li class="walk-card ${statusClass}" data-id="${w.id}">
          <div class="walk-top">
            <div>
              <div class="walk-time">${timeLabel(w.time)}</div>
              <div class="walk-dog">${esc(dog ? dog.nome : 'Cão removido')}</div>
              <div class="walk-client">${esc(client ? client.nome : 'Cliente removido')}</div>
            </div>
            ${pill}
          </div>
        </li>`;
      });
      html += `</ul></div>`;
    });
    views.agenda.innerHTML = html;

    views.agenda.querySelectorAll('.walk-card').forEach(card=>{
      card.addEventListener('click', ()=> openWalkDetail(card.dataset.id));
    });
  }

          return;
        }
        errorEl.classList.remove('show');

        const weeks = chkRepetir.checked ? Math.max(2, Number(el.querySelector('#f-semanas').value) || 4) : 1;
        for(let i=0;i<weeks;i++){
          await Walks.add({
            clientId, dogId,
            date: addDays(date, i*7),
            time,
            status: 'agendado',
            createdAt: Date.now()
          });
        }
        closeSheet();
        renderAgenda();
      });
    });

      <input type="hidden" id="f-lon">
      <label>Bairro</label>
      <input type="text" id="f-bairro" placeholder="Preenche sozinho ao escolher o endereço">
      <div class="hint">Escolha um endereço da lista pra ficar certinho no mapa depois</div>
      <div class="field-error" id="f-error">Informe ao menos o nome do cliente.</div>
      <div class="sheet-actions">
        <button class="btn-primary" id="save-cliente">Salvar e continuar</button>
      </div>
    `, (el)=>{
      setupAddressAutocomplete(
        el.querySelector('#f-endereco'),
        el.querySelector('#addr-suggestions'),
        el.querySelector('#f-lat'),
        el.querySelector('#f-lon'),
        el.querySelector('#f-bairro')
      );
      el.querySelector('#save-cliente').addEventListener('click', async ()=>{
        const nome = el.querySelector('#f-nome').value.trim();
        if(!nome){ el.querySelector('#f-error').classList.add('show'); return; }
        const lat = el.querySelector('#f-lat').value;
        const lon = el.querySelector('#f-lon').value;
        const id = await Clients.add({
          nome,
          telefone: el.querySelector('#f-telefone').value.trim(),
          email: el.querySelector('#f-email').value.trim().toLowerCase(),
          endereco: el.querySelector('#f-endereco').value.trim(),
          bairro: el.querySelector('#f-bairro').value.trim(),
          lat: lat ? Number(lat) : null,
          lon: lon ? Number(lon) : null,
          createdAt: Date.now()
        });
        openNovoCao(id, nome, true);
      });
    });
  }

  function openEditCliente(c){
    openSheet(`
      <h2>Editar cliente</h2>
      <label>Nome</label>
      <input type="text" id="f-nome" value="${esc(c.nome)}">
      <label>Telefone</label>
      <input type="tel" id="f-telefone" value="${esc(c.telefone)}">
      <label>E-mail (pra dar acesso ao cliente depois)</label>
      <input type="email" id="f-email" value="${esc(c.email)}" placeholder="email@exemplo.com">
      <label>Endereço</label>
      <div style="position:relative;">
        <input type="text" id="f-endereco" value="${esc(c.endereco)}" autocomplete="off">
        <ul class="addr-list" id="addr-suggestions" hidden></ul>
      </div>
      <input type="hidden" id="f-lat" value="${c.lat || ''}">
      <input type="hidden" id="f-lon" value="${c.lon || ''}">
      <label>Bairro</label>
      <input type="text" id="f-bairro" value="${esc(c.bairro)}">
      <div class="hint">Se reescrever o endereço, escolha de novo na lista pra manter o mapa certo</div>
      <div class="sheet-actions">
        <button class="btn-primary" id="save-cliente">Salvar alterações</button>
      </div>
    `, (el)=>{
      setupAddressAutocomplete(
        el.querySelector('#f-endereco'),
        el.querySelector('#addr-suggestions'),
        el.querySelector('#f-lat'),
        el.querySelector('#f-lon')
      );
      el.querySelector('#save-cliente').addEventListener('click', async ()=>{
        const nome = el.querySelector('#f-nome').value.trim();
        if(!nome) return;
        const lat = el.querySelector('#f-lat').value;
        const lon = el.querySelector('#f-lon').value;
        c.nome = nome;
        c.telefone = el.querySelector('#f-telefone').value.trim();
        c.email = el.querySelector('#f-email').value.trim().toLowerCase();
        c.endereco = el.querySelector('#f-endereco').value.trim();
        c.bairro = el.querySelector('#f-bairro').value.trim();
        c.lat = lat ? Number(lat) : null;
        c.lon = lon ? Number(lon) : null;
        await Clients.put(c);
        closeSheet();
        renderClientes();
      });
    });
  }

  function openNovoCao(clientId, clientName, isFirst){
    openSheet(`
      <h2>${isFirst ? 'Adicionar cão de ' + esc(clientName) : 'Novo cão'}</h2>
      <label>Nome do cão</label>
      <input type="text" id="f-cnome" placeholder="Nome do cão">
      <label>Raça</label>
      <input type="text" id="f-craca" placeholder="Raça (opcional)">
      <label>Observações</label>
      <textarea id="f-cobs" placeholder="Alergias, comportamento, cuidados..."></textarea>
      <label class="checkbox-row" style="margin-top:10px;"><input type="checkbox" id="f-grupo" checked> Pode passear em grupo com outros cães</label>
      <div class="field-error" id="f-error">Informe o nome do cão.</div>
      <div class="sheet-actions">
        ${isFirst ? '<button class="btn-secondary" id="skip">Pular por enquanto</button>' : ''}
        <button class="btn-primary" id="save-cao">Salvar cão</button>
      </div>
    `, (el)=>{
      const skipBtn = el.querySelector('#skip');
      if(skipBtn) skipBtn.addEventListener('click', ()=>{ closeSheet(); renderClientes(); });

      el.querySelector('#save-cao').addEventListener('click', async ()=>{
        const nome = el.querySelector('#f-cnome').value.trim();
        if(!nome){ el.querySelector('#f-error').classList.add('show'); return; }
        await Dogs.add({
          clientId,
          nome,
          raca: el.querySelector('#f-craca').value.trim(),
          obs: el.querySelector('#f-cobs').value.trim(),
          aceitaGrupo: el.querySelector('#f-grupo').checked,
          createdAt: Date.now()
        });
        closeSheet();
        setView('clientes');
      });
    });
  }

  /* ================= PLANOS ================= */
  async function renderPlanos(){
    const planos = await Planos.all();
    if(planos.length === 0){
      views.planos.innerHTML = `
        <div class="empty-state">
          <span class="glyph">💳</span>
          <p>Nenhum plano cadastrado ainda.<br>Toque em <strong>+</strong> pra adicionar o link de assinatura de um plano (criado na InfinitePay).</p>
        </div>`;
      return;
    }
    let html = '';
    planos.forEach(p=>{
      html += `<div class="client-card" data-id="${p.id}">
        <div class="client-head" style="cursor:default;">
          <div>
            <div class="client-name">${esc(p.nome)}</div>
            <div class="client-sub">${esc(p.preco)}</div>
          </div>
          <span class="dog-badge">${p.ativo === false ? 'Inativo' : 'Ativo'}</span>
        </div>
        <div class="client-dogs" style="padding:0 16px 16px 16px;">
          ${p.descricao ? `<div class="info-row">${esc(p.descricao)}</div>` : ''}
          <div class="client-actions">
            <button class="btn-ghost edit-plano-btn">Editar</button>
            <button class="btn-ghost danger del-plano-btn">Excluir</button>
          </div>
        </div>
      </div>`;
    });
    views.planos.innerHTML = html;

    views.planos.querySelectorAll('.client-card').forEach(card=>{
      const id = card.dataset.id;
      const p = planos.find(x=>x.id===id);
      card.querySelector('.edit-plano-btn').addEventListener('click', ()=> openEditPlano(p));
      card.querySelector('.del-plano-btn').addEventListener('click', async ()=>{
        if(confirm(`Excluir o plano "${p.nome}"?`)){
          await Planos.del(p.id);
          renderPlanos();
        }
      });
    });
  }

  function openNovoPlano(){
    openSheet(`
      <h2>Novo plano</h2>
      <label>Nome do plano</label>
      <input type="text" id="f-pnome" placeholder="Ex: 3x por semana">
      <label>Preço</label>
      <input type="text" id="f-ppreco" placeholder="Ex: R$ 200/mês">
      <label>Descrição (opcional)</label>
      <textarea id="f-pdesc" placeholder="O que está incluso"></textarea>
      <label>Link de assinatura (da InfinitePay)</label>
      <input type="text" id="f-plink" placeholder="https://...">
      <div class="field-error" id="f-error">Informe nome, preço e o link.</div>
      <div class="sheet-actions">
        <button class="btn-primary" id="save-plano">Salvar plano</button>
      </div>
    `, (el)=>{
      el.querySelector('#save-plano').addEventListener('click', async ()=>{
        const nome = el.querySelector('#f-pnome').value.trim();
        const preco = el.querySelector('#f-ppreco').value.trim();
        const link = el.querySelector('#f-plink').value.trim();
        if(!nome || !preco || !link){ el.querySelector('#f-error').classList.add('show'); return; }
        await Planos.add({
          nome, preco, link,
          descricao: el.querySelector('#f-pdesc').value.trim(),
          ativo: true,
          createdAt: Date.now()
        });
        closeSheet();
        renderPlanos();
      });
    });
  }

  function openEditPlano(p){
    openSheet(`
      <h2>Editar plano</h2>
      <label>Nome do plano</label>
      <input type="text" id="f-pnome" value="${esc(p.nome)}">
      <label>Preço</label>
      <input type="text" id="f-ppreco" value="${esc(p.preco)}">
      <label>Descrição (opcional)</label>
      <textarea id="f-pdesc">${esc(p.descricao)}</textarea>
      <label>Link de assinatura (da InfinitePay)</label>
      <input type="text" id="f-plink" value="${esc(p.link)}">
      <label class="checkbox-row" style="margin-top:10px;"><input type="checkbox" id="f-pativo" ${p.ativo === false ? '' : 'checked'}> Plano ativo (visível pros clientes)</label>
      <div class="sheet-actions">
        <button class="btn-primary" id="save-plano">Salvar alterações</button>
      </div>
    `, (el)=>{
      el.querySelector('#save-plano').addEventListener('click', async ()=>{
        p.nome = el.querySelector('#f-pnome').value.trim();
        p.preco = el.querySelector('#f-ppreco').value.trim();
        p.descricao = el.querySelector('#f-pdesc').value.trim();
        p.link = el.querySelector('#f-plink').value.trim();
        p.ativo = el.querySelector('#f-pativo').checked;
        await Planos.put(p);
        closeSheet();
        renderPlanos();
      });
    });
  }

  /* ---------- Visão do cliente (somente leitura) ---------- */
  async function renderClientView(email){
    const content = document.getElementById('client-content');
    content.innerHTML = '<div class="empty-state"><p>Carregando...</p></div>';
    try{
      const snap = await getDocs(query(colRef('clients'), where('email','==', email)));
      if(snap.empty){
        content.innerHTML = '<div class="empty-state"><p>Não encontramos seu cadastro. Fale com o seu passeador.</p></div>';
        return;
      }
      const clientDoc = snap.docs[0];
      const client = { id: clientDoc.id, ...clientDoc.data() };
      document.getElementById('client-title').textContent = client.nome;

      const [dogsSnap, walksSnap, planosSnap] = await Promise.all([
        getDocs(query(colRef('dogs'), where('clientId','==', client.id))),
        getDocs(query(colRef('walks'), where('clientId','==', client.id))),
        getDocs(colRef('planos'))
      ]);
      const dogs = dogsSnap.docs.map(d=>({id:d.id, ...d.data()}));
      const walks = walksSnap.docs.map(d=>({id:d.id, ...d.data()}));
      const planos = planosSnap.docs.map(d=>({id:d.id, ...d.data()})).filter(p=> p.ativo !== false);
      const dogMap = Object.fromEntries(dogs.map(d=>[d.id,d]));

      const today = todayStr();
      const now = new Date();
      const monthStart = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
      const lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
      const monthEnd = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
      const doMes = walks
        .filter(w=> w.status==='agendado' && w.date>=today && w.date<=monthEnd)
        .sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
      const historico = walks
        .filter(w=> w.status==='concluido')
        .sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));

      const dogNames = dogs.map(d=>esc(d.nome)).join(', ') || 'Nenhum cão cadastrado ainda';

      let html = `<div class="client-info"><div class="info-row">🐾 ${dogNames}</div></div>`;

      html += `<h2 style="margin-top:22px;margin-bottom:10px;">Passeios deste mês</h2>`;
      if(doMes.length === 0){
        html += `<div class="empty-state"><p>Nenhum passeio agendado neste mês ainda.</p></div>`;
      } else {
        doMes.forEach(w=>{
          const dg = dogMap[w.dogId];
          html += `<div class="walk-card" style="margin-left:0;margin-bottom:10px;">
            <div class="walk-top">
              <div>
                <div class="walk-time">${w.time}</div>
                <div class="walk-dog">${esc(dg ? dg.nome : '')}</div>
                <div class="walk-client">${dayLabel(w.date)}</div>
              </div>
            </div>
          </div>`;
        });
      }

      html += `<h2 style="margin-top:26px;margin-bottom:10px;">Histórico</h2>`;
      if(historico.length === 0){
        html += `<div class="empty-state"><p>Ainda não há passeios concluídos.</p></div>`;
      } else {
        historico.forEach(w=>{
          const dg = dogMap[w.dogId];
          const rep = w.report || {};
          html += `<div class="client-info" style="margin-bottom:12px;">
            <div class="info-row"><strong>${dayLabel(w.date)} às ${w.time}</strong> — ${esc(dg ? dg.nome : '')}</div>
            <div class="info-row">${rep.xixi ? '💧 Fez xixi' : '💧 Não fez xixi'}</div>
            <div class="info-row">${rep.coco ? '💩 Fez cocô' : '💩 Não fez cocô'}</div>
            ${rep.comportamento ? `<div class="info-row">🐾 ${esc(rep.comportamento)}</div>` : ''}
            ${rep.observacoes ? `<div class="info-row">📝 ${esc(rep.observacoes)}</div>` : ''}
          </div>`;
        });
      }

      html += `<h2 style="margin-top:26px;margin-bottom:10px;">Planos disponíveis</h2>`;
      if(planos.length === 0){
        html += `<div class="empty-state"><p>Nenhum plano disponível no momento.</p></div>`;
      } else {
        planos.forEach(p=>{
          html += `<div class="client-info" style="margin-bottom:12px;">
            <div class="info-row"><strong>${esc(p.nome)}</strong> — ${esc(p.preco)}</div>
            ${p.descricao ? `<div class="info-row">${esc(p.descricao)}</div>` : ''}
            <a class="btn-primary" style="display:block;text-align:center;text-decoration:none;margin-top:8px;" href="${esc(p.link)}" target="_blank" rel="noopener">Assinar</a>
          </div>`;
        });
      }
      content.innerHTML = html;
    }catch(err){
      console.error('Erro ao carregar visão do cliente:', err);
      content.innerHTML = '<div class="empty-state"><p>Não foi possível carregar seus dados agora. Tente de novo em alguns minutos.</p></div>';
    }
  }

  /* ---------- Autenticação (Firebase) ---------- */
  const authGate = document.getElementById('auth-gate');
  const appRoot = document.getElementById('app');
  const clientRoot = document.getElementById('client-app');
  const authEmail = document.getElementById('auth-email');
  const authPassword = document.getElementById('auth-password');
  const authError = document.getElementById('auth-error');
  const authSubmit = document.getElementById('auth-submit');
  const authToggle = document.getElementById('auth-toggle');
  const authTitle = document.getElementById('auth-title');
  let isSignup = false;
  let dbReady = false;

  function traduzErroFirebase(code){
    const map = {
      'auth/invalid-email': 'E-mail inválido.',
      'auth/user-not-found': 'Usuário não encontrado.',
      'auth/wrong-password': 'Senha incorreta.',
      'auth/invalid-credential': 'E-mail ou senha incorretos.',
      'auth/email-already-in-use': 'Já existe uma conta com esse e-mail.',
      'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
      'auth/missing-password': 'Digite uma senha.'
    };
    return map[code] || 'Não foi possível completar. Tente de novo.';
  }

  authToggle.addEventListener('click', ()=>{
    isSignup = !isSignup;
    authTitle.textContent = isSignup ? 'Criar conta' : 'Entrar';
    authSubmit.textContent = isSignup ? 'Criar conta' : 'Entrar';
    authToggle.textContent = isSignup ? 'Já tenho conta' : 'Ainda não tenho conta';
    authError.classList.remove('show');
  });

  authSubmit.addEventListener('click', async ()=>{
    const email = authEmail.value.trim();
    const password = authPassword.value;
    authError.classList.remove('show');
    if(!email || !password){
      authError.textContent = 'Preencha e-mail e senha.';
      authError.classList.add('show');
      return;
    }
    authSubmit.disabled = true;
    try{
      if(isSignup){
        await createUserWithEmailAndPassword(fbAuth, email, password);
      } else {
        await signInWithEmailAndPassword(fbAuth, email, password);
      }
    }catch(err){
      authError.textContent = traduzErroFirebase(err.code);
      authError.classList.add('show');
    }
    authSubmit.disabled = false;
  });

  document.getElementById('logout-btn').addEventListener('click', ()=> signOut(fbAuth));
  document.getElementById('client-logout-btn').addEventListener('click', ()=> signOut(fbAuth));

  onAuthStateChanged(fbAuth, async (user)=>{
    if(user){
      authGate.style.display = 'none';
      if(user.uid === ADMIN_UID){
        appRoot.style.display = '';
        clientRoot.style.display = 'none';
        if(!dbReady){
          try{
            await openPhotoDB();
            dbReady = true;
            renderAgenda();
          }catch(err){
            document.getElementById('view-agenda').innerHTML =
              '<div class="empty-state"><p>Não foi possível abrir o armazenamento local de fotos neste navegador.</p></div>';
            console.error(err);
          }
        }
      } else {
        appRoot.style.display = 'none';
        clientRoot.style.display = '';
        renderClientView((user.email || '').toLowerCase());
      }
    } else {
      dbReady = false;
      authGate.style.display = 'flex';
      appRoot.style.display = 'none';
      clientRoot.style.display = 'none';
    }
  });

  if('serviceWorker' in navigator){
    // Registration is a no-op inside this preview sandbox; it activates once
    // the file is hosted for real (e.g. GitHub Pages), enabling offline use.
    window.addEventListener('load', ()=>{
      try{
        const swCode = `self.addEventListener('fetch', ()=>{});`;
        const blob = new Blob([swCode], {type:'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
      }catch(e){}
    });
  }

  setTimeout(()=>{
    const splash = document.getElementById('splash');
    if(splash){
      splash.classList.add('fade-out');
      setTimeout(()=> splash.remove(), 450);
    }
  }, 1100);
})();
</script>
</body>
</html>
