<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rota Canina — Painel do Passeador</title>
<meta name="theme-color" content="#2F4B3C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#EDEAE2;
    --surface:#FFFFFF;
    --surface-alt:#F7F5EF;
    --ink:#22281F;
    --ink-soft:#5B6358;
    --pine:#2F4B3C;
    --pine-dark:#1E3226;
    --ochre:#B8863B;
    --ochre-soft:#EADFC7;
    --line:#DAD5C8;
    --line-strong:#C7C0AE;
    --danger:#A24B3E;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  h1,h2,h3{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    margin:0 0 4px 0;
    letter-spacing:-0.01em;
  }
  #app, #client-app{
    max-width:520px;
    margin:0 auto;
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  @media (min-width: 720px){
    #app, #client-app{
      max-width:640px;
      height:auto;
      min-height:100dvh;
      box-shadow:0 0 40px rgba(34,40,31,0.08);
    }
    body{ background:var(--surface-alt); }
  }
  .topbar{
    padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 14px 20px;
    background:var(--bg);
    position:sticky;
    top:0;
    z-index:5;
    box-shadow:0 4px 12px rgba(34,40,31,0.04);
  }
  .topbar .brand{font-size:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ochre);margin-bottom:4px;}
  .topbar h1{font-size:34px;font-style:italic;color:var(--pine-dark);}
  .topbar .sub{font-size:14px;color:var(--ink-soft);}
  main.view{
    flex:1;
    overflow-y:auto;
    padding:4px 20px 100px 20px;
    display:none;
    animation:viewFade .22s ease;
  }
  main.view.active{display:block;}
  @keyframes viewFade{
    0%{opacity:0;transform:translateY(6px);}
    100%{opacity:1;transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    main.view{animation:none;}
  }

  /* Empty states */
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:34px;display:block;margin-bottom:10px;opacity:.7;}
  .empty-state p{margin:0;font-size:15px;line-height:1.5;}

  /* Agenda */
  .day-group{margin-bottom:26px;}
  .day-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  .day-head .label{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15px;
    color:var(--pine-dark);
    white-space:nowrap;
  }
  .day-head .rule{
    flex:1;
    height:0;
    border-top:2px dashed var(--ochre);
    opacity:.55;
  }
  .walks-list{
    list-style:none;
    margin:0;
    padding-left:20px;
    border-left:2px dashed var(--line-strong);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .walk-card{
    position:relative;
    background:var(--surface);
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:0 2px 10px rgba(34,40,31,0.07), 0 1px 2px rgba(34,40,31,0.05);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .walk-card:active{transform:scale(0.98);}
  .walk-card::before{
    content:'';
    position:absolute;
    left:-26px;
    top:20px;
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--pine);
    border:3px solid var(--bg);
  }
  .walk-card.status-concluido::before{background:var(--ochre);}
  .walk-card.status-cancelado{opacity:.5;}
  .walk-card.status-cancelado::before{background:var(--line-strong);}
  .walk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .walk-time{font-family:'Fraunces',serif;font-weight:600;font-size:20px;color:var(--pine-dark);}
  .walk-dog{font-size:16px;font-weight:600;margin-top:2px;}
  .walk-client{font-size:14px;color:var(--ink-soft);margin-top:1px;}
  .status-pill{
    font-size:12px;
    font-weight:600;
    padding:4px 11px;
    border-radius:99px;
    background:var(--surface-alt);
    color:var(--ink-soft);
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .status-pill::before{
    content:'';
    width:6px;height:6px;border-radius:50%;
    background:var(--ink-soft);
    flex-shrink:0;
  }
  .status-pill.concluido{background:var(--ochre-soft);color:#7A5A22;}
  .status-pill.concluido::before{background:var(--ochre);}

  /* Clients */
  .client-card{
    background:var(--surface);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(34,40,31,0.07), 0 1px 2px rgba(34,40,31,0.05);
    transition:box-shadow .15s ease;
  }
  .client-avatar{
    width:40px;height:40px;border-radius:50%;
    background:var(--pine);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:16px;
    flex-shrink:0;
  }

  /* Hero header inside sheets (walk detail) */
  .sheet-hero{
    background:var(--pine);
    color:#fff;
    margin:6px -20px 18px -20px;
    padding:26px 20px 22px 20px;
    border-radius:22px;
    text-align:center;
  }
  .sheet-hero-avatar{
    width:52px;height:52px;border-radius:50%;
    background:rgba(255,255,255,0.16);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:20px;
    margin:0 auto 10px auto;
  }
  .sheet-hero-time{font-family:'Fraunces',serif;font-style:italic;font-size:30px;font-weight:600;line-height:1.1;}
  .sheet-hero-title{font-size:17px;font-weight:700;margin-top:4px;}
  .sheet-hero-sub{font-size:13px;opacity:.85;margin-top:2px;}
  .client-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    cursor:pointer;
  }
  .client-name{font-family:'Fraunces',serif;font-weight:600;font-size:16px;}
  .client-sub{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .dog-badge{
    font-size:13px;
    background:var(--surface-alt);
    color:var(--pine-dark);
    padding:4px 10px;
    border-radius:99px;
    white-space:nowrap;
  }
  .client-dogs{
    padding:0 16px 16px 16px;
    border-top:1px solid var(--line);
  }
  .client-dogs[hidden]{display:none;}
  .client-info{padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:4px;}

  /* Renewal banner */
  .renew-banner{
    background:var(--ochre-soft);
    border-radius:var(--radius);
    padding:14px 16px;
    margin:16px 0;
  }
  .renew-banner .btn-primary{background:var(--ochre);}
  #live-map{
    width:100%;
    height:220px;
    border-radius:12px;
    margin-top:10px;
    background:var(--surface-alt);
  }

  /* Month grid (client "deste mês") */
  .month-walks-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
    gap:10px;
  }
  .walk-card-compact{
    padding:12px 14px;
  }
  .walk-card-compact::before{content:none;}
  .walk-card-compact .walk-time{font-size:16px;}
  .walk-card-compact .walk-dog{font-size:14px;}
  .walk-card-compact .walk-client{font-size:12px;}

  /* Histórico por mês (acordeão) */
  .month-group{margin-top:6px;}
  .month-toggle{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--surface-alt);
    border:none;
    border-radius:12px;
    padding:12px 14px;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    margin-bottom:8px;
  }
  .month-toggle .chev{transition:transform .2s ease;}
  .month-toggle.open .chev{transform:rotate(180deg);}
  .month-items{margin-bottom:10px;}

  /* Página do cliente: textos centralizados, exceto parágrafos livres */
  #client-view-passeios, #client-view-historico{text-align:center;}
  #client-view-passeios .info-row, #client-view-historico .info-row{justify-content:center;}
  #client-view-passeios .freetext, #client-view-historico .freetext{text-align:left;justify-content:flex-start;}

  .info-row{font-size:15px;color:var(--ink);display:flex;align-items:flex-start;gap:6px;margin-bottom:6px;}
  .info-row:last-child{margin-bottom:0;}
  .addr-link{color:var(--pine);text-decoration:underline;text-decoration-color:var(--ochre);font-weight:500;}
  .addr-list{
    position:absolute;
    top:100%;left:0;right:0;
    margin:4px 0 0 0;
    padding:0;
    list-style:none;
    background:var(--surface);
    border:1px solid var(--line-strong);
    border-radius:10px;
    max-height:220px;
    overflow-y:auto;
    z-index:30;
    box-shadow:0 6px 16px rgba(34,40,31,0.12);
  }
  .addr-list[hidden]{display:none;}
  .addr-list li{
    padding:10px 12px;
    font-size:13px;
    line-height:1.35;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .addr-list li:last-child{border-bottom:none;}
  .addr-list li:active{background:var(--surface-alt);}
  .dog-chip{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .dog-chip:last-of-type{border-bottom:none;}
  .dog-chip .dog-meta{color:var(--ink-soft);font-size:13px;margin-top:2px;}
  .dog-chip .dog-actions button{font-size:13px;}
  .client-actions, .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:14px;
  }

  /* Buttons */
  button{font-family:inherit;}
  .btn-primary{
    width:100%;
    background:var(--pine);
    color:#fff;
    border:none;
    border-radius:99px;
    padding:15px 18px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(47,75,60,0.3);
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn-primary:active{background:var(--pine-dark);transform:scale(0.97);box-shadow:0 1px 4px rgba(47,75,60,0.22);}
  .btn-primary::after{content:'→';font-weight:700;}
  .btn-primary.no-arrow::after{content:'';}
  .btn-secondary{
    flex:1;
    background:var(--surface-alt);
    color:var(--ink);
    border:none;
    border-radius:99px;
    padding:14px 18px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .btn-secondary:active{transform:scale(0.97);background:var(--line);}
  .btn-ghost{
    background:none;
    border:1px solid var(--line-strong);
    color:var(--ink);
    border-radius:99px;
    padding:8px 14px;
    font-size:13px;
    transition:transform .12s ease, background .12s ease;
    cursor:pointer;
  }
  .btn-ghost.danger{color:var(--danger);border-color:#E3C7C1;}

  /* Bottom nav + FAB */
  .bottomnav{
    display:flex;
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px) 12px;
    position:relative;
    z-index:5;
  }
  .bottomnav button{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:8px 6px 6px 6px;
    font-size:12px;
    color:var(--ink-soft);
    cursor:pointer;
    position:relative;
  }
  .bottomnav button .ic{
    font-size:18px;
    width:38px;height:26px;
    display:flex;align-items:center;justify-content:center;
    border-radius:99px;
    transition:background .18s ease;
  }
  .bottomnav button.active .ic{background:var(--ochre-soft);}
  .bottomnav button.active{color:var(--pine);font-weight:600;}
  .nav-badge{
    position:absolute;
    top:2px;
    right:26%;
    background:var(--danger);
    color:#fff;
    font-size:10px;
    font-weight:700;
    min-width:16px;
    height:16px;
    line-height:16px;
    border-radius:50%;
    text-align:center;
    padding:0 3px;
  }
  .nav-badge[hidden]{display:none;}
  .fab{
    position:absolute;
    right:20px;
    bottom:78px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--ochre);
    color:#fff;
    border:none;
    font-size:28px;
    line-height:1;
    box-shadow:0 4px 12px rgba(232,130,95,0.4);
    cursor:pointer;
    z-index:6;
  }
  .fab:active{transform:scale(0.96);}

  /* Sheet */
  .sheet-overlay{
    position:fixed;
    inset:0;
    background:rgba(20,24,17,0.45);
    display:flex;
    align-items:flex-end;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
    z-index:20;
  }
  .sheet-overlay.open{opacity:1;pointer-events:auto;}
  .sheet{
    background:var(--bg);
    width:100%;
    max-width:520px;
    margin:0 auto;
    border-radius:24px 24px 0 0;
    padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 24px) 20px;
    max-height:88vh;
    overflow-y:auto;
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
    box-shadow:0 -8px 32px rgba(34,40,31,0.18);
  }
  .sheet-overlay.open .sheet{transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){
    .sheet-overlay, .sheet{transition:none;}
  }
  .sheet-handle{
    width:36px;height:4px;background:var(--line-strong);
    border-radius:99px;margin:6px auto 14px auto;
  }
  .sheet label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin:14px 0 6px 0;
  }
  .sheet input[type=text],
  .sheet input[type=tel],
  .sheet input[type=date],
  .sheet input[type=time],
  .sheet input[type=number],
  .sheet select,
  .sheet textarea{
    width:100%;
    border:1px solid var(--line-strong);
    background:var(--surface);
    border-radius:10px;
    padding:12px;
    font-size:15px;
    color:var(--ink);
    font-family:inherit;
  }
  .sheet textarea{resize:vertical;min-height:64px;}
  .rate-block{text-align:left;}
  .rate-block label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin:0 0 6px 0;
  }
  .rate-block select, .rate-block textarea{
    width:100%;
    border:1px solid var(--line-strong);
    background:var(--surface);
    border-radius:10px;
    padding:12px;
    font-size:15px;
    color:var(--ink);
    font-family:inherit;
    margin-bottom:8px;
  }
  .rate-block textarea{resize:vertical;min-height:56px;}
  .walk-photo{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin:8px 0;display:block;}
  .checkbox-row{
    display:flex !important;
    align-items:center;
    gap:8px;
    font-size:14px !important;
    font-weight:500 !important;
    color:var(--ink) !important;
  }
  .checkbox-row input{width:auto !important;}
  .field-error{color:var(--danger);font-size:13px;margin-top:4px;display:none;}
  .field-error.show{display:block;}
  .hint{font-size:13px;color:var(--ink-soft);margin-top:4px;}

  /* Auth gate */
  .auth-gate{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .auth-card{
    width:100%;
    max-width:360px;
    background:var(--surface);
    border-radius:20px;
    padding:28px 24px;
    box-shadow:0 4px 16px rgba(34,40,31,0.08);
  }
  .auth-card .brand{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ochre);margin-bottom:6px;}
  .auth-card h1{font-size:24px;font-style:italic;color:var(--pine-dark);margin-bottom:16px;}
  .auth-card label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:14px 0 6px 0;}
  .auth-card input{
    width:100%;border:1px solid var(--line-strong);background:var(--bg);
    border-radius:10px;padding:12px;font-size:15px;color:var(--ink);font-family:inherit;
  }
  .topbar-row{display:flex;justify-content:space-between;align-items:center;}
  .logout-btn{background:none;border:none;color:var(--ink-soft);font-size:13px;text-decoration:underline;cursor:pointer;padding:0;}

  /* Splash */
  #splash{
    position:fixed;inset:0;
    background:var(--pine-dark);
    display:flex;align-items:center;justify-content:center;
    z-index:100;
    transition:opacity .4s ease;
  }
  #splash.fade-out{opacity:0;pointer-events:none;}
  .splash-inner{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    color:var(--bg);
    animation:splashPop .6s ease;
  }
  .splash-paw{color:var(--ochre);}
  .splash-name{
    font-family:'Fraunces',serif;font-style:italic;font-weight:600;
    font-size:28px;letter-spacing:.02em;
  }
  @keyframes splashPop{
    0%{opacity:0;transform:scale(.85);}
    100%{opacity:1;transform:scale(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .splash-inner{animation:none;}
  }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-inner">
    <svg class="splash-paw" viewBox="0 0 100 100" width="72" height="72" aria-hidden="true">
      <circle cx="50" cy="58" r="18" fill="currentColor"/>
      <circle cx="30" cy="32" r="8.5" fill="currentColor"/>
      <circle cx="70" cy="32" r="8.5" fill="currentColor"/>
      <circle cx="18" cy="50" r="7" fill="currentColor"/>
      <circle cx="82" cy="50" r="7" fill="currentColor"/>
    </svg>
    <div class="splash-name">Rota Canina</div>
  </div>
</div>

<div id="auth-gate" class="auth-gate">
  <div class="auth-card">
    <div class="brand">Rota Canina</div>
    <h1 id="auth-title">Entrar</h1>
    <div class="field-error" id="auth-error"></div>
    <label>E-mail</label>
    <input type="email" id="auth-email" autocomplete="email">
    <label>Senha</label>
    <input type="password" id="auth-password" autocomplete="current-password">
    <div class="sheet-actions" style="flex-direction:column;">
      <button class="btn-primary" id="auth-submit">Entrar</button>
      <button class="btn-ghost" id="auth-toggle" style="width:100%;">Ainda não tenho conta</button>
    </div>
    <div class="hint" style="text-align:center;margin:14px 0 6px 0;">ou</div>
    <button class="btn-secondary" id="auth-google-btn" style="width:100%;">Entrar com Google</button>
  </div>
</div>

<div id="app" style="display:none;">

  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">Rota Canina</div>
      <div style="display:flex;gap:14px;align-items:center;">
        <button class="logout-btn" id="config-btn">⚙️ Config</button>
        <button class="logout-btn" id="logout-btn">Sair</button>
      </div>
    </div>
    <h1 id="topbar-title">Agenda</h1>
    <div class="sub" id="topbar-sub"></div>
  </div>

  <main class="view active" id="view-agenda"></main>
  <main class="view" id="view-clientes"></main>
  <main class="view" id="view-planos"></main>

  <button class="fab" id="fab" aria-label="Adicionar">+</button>

  <nav class="bottomnav">
    <button data-view="agenda" class="active">
      <span class="ic">🗓️</span>Agenda
    </button>
    <button data-view="clientes">
      <span class="ic">🐾</span>Clientes
    </button>
    <button data-view="planos">
      <span class="ic">💳</span>Planos
    </button>
  </nav>
</div>

<div id="client-app" style="display:none;">
  <div class="topbar">
    <div class="topbar-row">

<script type="module">

const firebaseConfig = {

(function(){
  "use strict";

  /* ---------- Firestore layer (dados na nuvem) ---------- */
  const ADMIN_UID = 'VUXMg2U6uNZLyQNhaDCc333kXoO2';
  function colRef(name){ return collection(firestoreDb, 'users', ADMIN_UID, name); }
  function docRef(name, id){ return doc(firestoreDb, 'users', ADMIN_UID, name, id); }

  const Clients = {
    add: async (data)=> (await addDoc(colRef('clients'), data)).id,
    put: async (data)=>{ const {id, ...rest} = data; await updateDoc(docRef('clients', id), rest); },
    all: async ()=>{ const snap = await getDocs(colRef('clients')); return snap.docs.map(d=>({id:d.id, ...d.data()})); },
    del: (id)=> deleteDoc(docRef('clients', id)),
  };
  const Dogs = {
    add: async (data)=> (await addDoc(colRef('dogs'), data)).id,
    put: async (data)=>{ const {id, ...rest} = data; await updateDoc(docRef('dogs', id), rest); },
    all: async ()=>{ const snap = await getDocs(colRef('dogs')); return snap.docs.map(d=>({id:d.id, ...d.data()})); },
    byClient: async (clientId)=>{
      const snap = await getDocs(query(colRef('dogs'), where('clientId','==',clientId)));
      return snap.docs.map(d=>({id:d.id, ...d.data()}));
    },
    del: (id)=> deleteDoc(docRef('dogs', id)),
  };
  const Walks = {
    add: async (data)=> (await addDoc(colRef('walks'), data)).id,
    put: async (data)=>{ const {id, ...rest} = data; await updateDoc(docRef('walks', id), rest); },
    all: async ()=>{ const snap = await getDocs(colRef('walks')); return snap.docs.map(d=>({id:d.id, ...d.data()})); },
    del: (id)=> deleteDoc(docRef('walks', id)),
  };
  const Planos = {
    add: async (data)=> (await addDoc(colRef('planos'), data)).id,
    put: async (data)=>{ const {id, ...rest} = data; await updateDoc(docRef('planos', id), rest); },
    all: async ()=>{ const snap = await getDocs(colRef('planos')); return snap.docs.map(d=>({id:d.id, ...d.data()})); },
    del: (id)=> deleteDoc(docRef('planos', id)),
  };
  const Avulsos = {
    add: async (data)=> (await addDoc(colRef('avulsos'), data)).id,
    put: async (data)=>{ const {id, ...rest} = data; await updateDoc(docRef('avulsos', id), rest); },
    all: async ()=>{ const snap = await getDocs(colRef('avulsos')); return snap.docs.map(d=>({id:d.id, ...d.data()})); },
    del: (id)=> deleteDoc(docRef('avulsos', id)),
  };
  const Config = {
    get: async ()=>{
      const snap = await getDoc(docRef('config', 'settings'));
      return snap.exists() ? snap.data() : {};
    },
    save: (data)=> setDoc(docRef('config', 'settings'), data, {merge:true}),
  };
  function submitAvaliacao(walkId, avaliacao){
    return updateDoc(docRef('walks', walkId), { avaliacao });
  }

  /* ---------- Fotos (ficam só no celular; Storage na nuvem ainda não está ativo) ---------- */
  const PHOTO_DB_NAME = 'trilha_photos_db';
  let photoDb;
  function openPhotoDB(){
    return new Promise((resolve, reject)=>{
      const req = indexedDB.open(PHOTO_DB_NAME, 1);
      req.onupgradeneeded = (e)=>{
        const d = e.target.result;
        if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', {keyPath:'walkId'});
      };
      req.onsuccess = (e)=>{ photoDb = e.target.result; resolve(photoDb); };
      req.onerror = (e)=> reject(e.target.error);
    });
  }
  const Photos = {
    save: (walkId, blob)=> new Promise((res,rej)=>{
      const tx = photoDb.transaction('photos','readwrite').objectStore('photos').put({walkId, blob});
      tx.onsuccess = ()=> res(); tx.onerror = ()=> rej(tx.error);
    }),
    get: (walkId)=> new Promise((res,rej)=>{
      const req = photoDb.transaction('photos').objectStore('photos').get(walkId);
      req.onsuccess = ()=> res(req.result ? req.result.blob : null);
      req.onerror = ()=> rej(req.error);
    }),
  };

  async function deleteDogCascade(dogId){
    const walks = await Walks.all();
    for(const w of walks){ if(w.dogId === dogId) await Walks.del(w.id); }
    await Dogs.del(dogId);
  }
  async function deleteClientCascade(clientId){
    const dogs = await Dogs.byClient(clientId);
    for(const dgo of dogs){ await deleteDogCascade(dgo.id); }
    await Clients.del(clientId);
  }

  /* ---------- Helpers ---------- */
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function addDays(dateStr, n){
    const d = new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()+n);
    return d.toISOString().slice(0,10);
  }
  function dayLabel(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    const t = new Date(); t.setHours(0,0,0,0);
    const diff = Math.round((d - t) / 86400000);
    if(diff === 0) return 'Hoje';
    if(diff === 1) return 'Amanhã';
    const weekday = d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
    const day = d.getDate();
    const month = d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
    return `${weekday}, ${day} ${month}`;
  }
  function timeLabel(t){ return t; }
  function diasParaVencer(dataStr){
    if(!dataStr) return null;
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const venc = new Date(dataStr+'T00:00:00');
    return Math.round((venc - hoje) / 86400000);
  }
  function monthLabel(key){
    const [y,m] = key.split('-');
    const d = new Date(Number(y), Number(m)-1, 1);
    const label = d.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
    return label.charAt(0).toUpperCase() + label.slice(1);
  }
  function vencimentoBadge(c){
    const dias = diasParaVencer(c.planoVencimento);
    if(dias === null) return '';
    if(dias < 0) return '<span class="status-pill" style="background:#F3D9D5;color:#8A3B2E;">Vencido</span>';
    if(dias <= 5) return `<span class="status-pill concluido">Vence em ${dias===0 ? 'hoje' : dias+'d'}</span>`;
    return '';
  }
  function esc(str){
    return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function addressLink(c){
    if(!c || !c.endereco) return '';
    if(c.lat && c.lon) return `https://www.google.com/maps?q=${c.lat},${c.lon}`;
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.endereco)}`;
  }
  function whatsappLink(tel){
    if(!tel) return '';
    const digits = tel.replace(/\D/g,'');
    if(!digits) return '';
    const withCountry = digits.length <= 11 ? '55'+digits : digits;
    return `https://wa.me/${withCountry}`;
  }
  function debounce(fn, delay){
    let t;
    return (...args)=>{ clearTimeout(t); t = setTimeout(()=> fn(...args), delay); };
  }

  /* ---------- Google Places (New) — autocomplete de endereço ---------- */
  const GOOGLE_MAPS_KEY = 'AIzaSyB_rZOccdW4uWnk-uQhrwUDTTbrebYmvFc';
  let placesLibPromise = null;
  function loadGoogleMaps(){
    return new Promise((resolve, reject)=>{
      if(window.google && window.google.maps){ resolve(); return; }
      window.__gmapsReady = resolve;
      const s = document.createElement('script');
      s.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_KEY}&libraries=places&callback=__gmapsReady&loading=async`;
      s.async = true;
      s.onerror = ()=> reject(new Error('Falha ao carregar Google Maps'));
      document.head.appendChild(s);
    });
  }
  async function getPlacesLib(){
    if(!placesLibPromise){
      placesLibPromise = loadGoogleMaps().then(()=> google.maps.importLibrary('places'));
    }
    return placesLibPromise;
  }

  /* ---------- Google Agenda ---------- */
  const GOOGLE_CALENDAR_CLIENT_ID = '119520718621-0d52sbv4lebl0vcjvg6gjtk4j1b7rg0r.apps.googleusercontent.com';
  let googleTokenClient = null;
  let googleAccessToken = null;
  let googleTokenExpiresAt = 0;
  function getGoogleAccessToken(){
    return new Promise((resolve, reject)=>{
      if(googleAccessToken && Date.now() < googleTokenExpiresAt){ resolve(googleAccessToken); return; }
      if(!window.google || !window.google.accounts){ reject(new Error('Google Identity Services não carregou ainda. Tente de novo em alguns segundos.')); return; }
      if(!googleTokenClient){
        googleTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CALENDAR_CLIENT_ID,
          scope: 'https://www.googleapis.com/auth/calendar.events',
          callback: (resp)=>{
            if(resp.error){ reject(new Error(resp.error)); return; }
            googleAccessToken = resp.access_token;
            googleTokenExpiresAt = Date.now() + (Number(resp.expires_in || 3500) * 1000);
            resolve(googleAccessToken);
          },
        });
      } else {
        googleTokenClient.callback = (resp)=>{
          if(resp.error){ reject(new Error(resp.error)); return; }
          googleAccessToken = resp.access_token;
          googleTokenExpiresAt = Date.now() + (Number(resp.expires_in || 3500) * 1000);
          resolve(googleAccessToken);
        };
      }
      googleTokenClient.requestAccessToken();
    });
  }
  async function criarEventoGoogleAgenda(w, dg, c){
    const token = await getGoogleAccessToken();
    const startDateTime = `${w.date}T${w.time}:00`;
    const [hh, mm] = w.time.split(':').map(Number);
    const endMinutes = hh*60 + mm + 60;
    const endTime = `${String(Math.floor(endMinutes/60)%24).padStart(2,'0')}:${String(endMinutes%60).padStart(2,'0')}`;
    const endDateTime = `${w.date}T${endTime}:00`;
    const event = {
      summary: `Passeio — ${dg ? dg.nome : 'cão'}`,
      description: `Cliente: ${c ? c.nome : ''}${c && c.endereco ? '\nEndereço: '+c.endereco : ''}`,
      start: { dateTime: startDateTime, timeZone: 'America/Sao_Paulo' },
      end: { dateTime: endDateTime, timeZone: 'America/Sao_Paulo' },
    };
    const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(event),
    });
    if(!res.ok){
      const errBody = await res.text();
      throw new Error(`Falha ao criar evento (${res.status}): ${errBody}`);
    }
    return res.json();
  }

  /* ---------- GPS ao vivo durante o passeio ---------- */
  let wakeLock = null;
  let trackingWatchId = null;
  let trackingWalkId = null;
  let trackingLastWrite = 0;
  let trackingHeartbeat = null;
  async function requestWakeLock(){
    try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }
    catch(e){ console.warn('Wake Lock não disponível:', e); }
  }
  function releaseWakeLock(){
    if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
  }
  function getPosition(){
    return new Promise((resolve, reject)=>{
      if(!navigator.geolocation){ reject(new Error('Geolocalização não suportada')); return; }
      navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
    });
  }
  async function enviarLocalizacao(pos){
    trackingLastWrite = Date.now();
    try{
      await updateDoc(docRef('walks', trackingWalkId), {
        location: { lat: pos.coords.latitude, lng: pos.coords.longitude, updatedAt: trackingLastWrite }
      });
    }catch(err){ console.error('Erro ao salvar localização:', err); }
  }
  async function iniciarRastreio(walkId){
    await requestWakeLock();
    trackingWalkId = walkId;
    trackingLastWrite = 0;
    // watchPosition: o navegador chama de novo sempre que o GPS entrega uma
    // posição nova (mais confiável que um timer, que pode ser pausado pelo
    // celular quando o site fica em segundo plano por um tempo).
    trackingWatchId = navigator.geolocation.watchPosition(
      (pos)=>{ if(Date.now() - trackingLastWrite >= 45000) enviarLocalizacao(pos); },
      (err)=> console.error('Erro de geolocalização:', err),
      { enableHighAccuracy:true, maximumAge:0, timeout:20000 }
    );
    // Reforço: se o GPS não entregar nada novo (parado, ou throttling do
    // navegador), tenta puxar uma leitura manual a cada 1 min mesmo assim.
    if(trackingHeartbeat) clearInterval(trackingHeartbeat);
    trackingHeartbeat = setInterval(async ()=>{
      if(Date.now() - trackingLastWrite >= 55000){
        try{ const pos = await getPosition(); await enviarLocalizacao(pos); }
        catch(err){ console.error('Erro no heartbeat de localização:', err); }
      }
    }, 60000);
    const primeira = await getPosition();
    await enviarLocalizacao(primeira);
  }
  function pararRastreio(){
    if(trackingWatchId !== null){ navigator.geolocation.clearWatch(trackingWatchId); trackingWatchId = null; }
    if(trackingHeartbeat){ clearInterval(trackingHeartbeat); trackingHeartbeat = null; }
    trackingWalkId = null;
    releaseWakeLock();
  }
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible' && trackingWatchId !== null){
      requestWakeLock();
    }
  });
  let liveMapUnsubscribe = null;
  async function initLiveMap(w){
    if(liveMapUnsubscribe){ liveMapUnsubscribe(); liveMapUnsubscribe = null; }
    const mapEl = document.getElementById('live-map');
    if(!mapEl || !w.location) return;
    await loadGoogleMaps();
    const center = { lat: w.location.lat, lng: w.location.lng };
    const map = new google.maps.Map(mapEl, { center, zoom: 16, disableDefaultUI: true, zoomControl: true });
    const marker = new google.maps.Marker({ position: center, map });
    updateLiveMapTimestamp(w.location.updatedAt);
    liveMapUnsubscribe = onSnapshot(docRef('walks', w.id), (snap)=>{
      const data = snap.data();
      if(data && data.location){
        const pos = { lat: data.location.lat, lng: data.location.lng };
        marker.setPosition(pos);
        map.panTo(pos);
        updateLiveMapTimestamp(data.location.updatedAt);
      }
      if(data && data.status !== 'em_andamento'){
        if(liveMapUnsubscribe){ liveMapUnsubscribe(); liveMapUnsubscribe = null; }
      }
    });
  }
  function updateLiveMapTimestamp(ts){
    const el = document.getElementById('live-map-updated');
    if(el) el.textContent = `Atualizado às ${new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
  }
  function setupAddressAutocomplete(input, list, latInput, lonInput, bairroInput){
    let sessionToken = null;
    const runSearch = debounce(async ()=>{
      const q = input.value.trim();
      if(q.length < 4){ list.hidden = true; list.innerHTML=''; return; }
      try{
        const { AutocompleteSuggestion, AutocompleteSessionToken } = await getPlacesLib();
        if(!sessionToken) sessionToken = new AutocompleteSessionToken();
        const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions({
          input: q,
          includedRegionCodes: ['br'],
          language: 'pt-BR',
          sessionToken
        });
        if(!suggestions || !suggestions.length){ list.hidden = true; list.innerHTML=''; return; }
        list._suggestions = suggestions;
        list.innerHTML = suggestions.map((s,i)=>`<li data-i="${i}">${esc(s.placePrediction.text.text)}</li>`).join('');
        list.hidden = false;
      }catch(e){
        console.error('Erro na busca de endereço (Google Places):', e);
        list.hidden = true;
      }
    }, 300);
    input.addEventListener('input', ()=>{
      latInput.value = ''; lonInput.value = '';
      runSearch();
    });
    input.addEventListener('blur', ()=>{ setTimeout(()=>{ list.hidden = true; }, 150); });
    list.addEventListener('click', async (e)=>{
      const li = e.target.closest('li');
      if(!li) return;
      const suggestion = list._suggestions[Number(li.dataset.i)];
      try{
        const place = suggestion.placePrediction.toPlace();
        await place.fetchFields({ fields: ['formattedAddress','location','addressComponents'] });
        input.value = place.formattedAddress || suggestion.placePrediction.text.text;
        latInput.value = place.location ? place.location.lat() : '';
        lonInput.value = place.location ? place.location.lng() : '';
        if(bairroInput && !bairroInput.value){
          const comp = (place.addressComponents || []).find(c =>
            c.types.includes('sublocality_level_1') || c.types.includes('sublocality') || c.types.includes('neighborhood')
          );
          if(comp) bairroInput.value = comp.longText;
        }
      }catch(err){
        console.error('Erro ao buscar detalhes do endereço:', err);
        input.value = suggestion.placePrediction.text.text;
      }
      list.hidden = true;
      sessionToken = null;
    });
  }

  /* ---------- Sheet (bottom modal) ---------- */
  const sheetOverlay = document.getElementById('sheet-overlay');
  const sheetContent = document.getElementById('sheet-content');
  function openSheet(html, onMount){
    sheetContent.innerHTML = html;
    sheetOverlay.classList.add('open');

    sheetOverlay.classList.remove('open');
  }
  sheetOverlay.addEventListener('click', (e)=>{

  /* ---------- Navigation ---------- */
  const views = {
    agenda: document.getElementById('view-agenda'),
    clientes: document.getElementById('view-clientes'),
    planos: document.getElementById('view-planos'),
  };
  const navButtons = document.querySelectorAll('#app .bottomnav button');

  const topbarSub = document.getElementById('topbar-sub');

  function setView(name){
    currentView = name;
    Object.entries(views).forEach(([k, el])=> el.classList.toggle('active', k===name));
    navButtons.forEach(b=> b.classList.toggle('active', b.dataset.view===name));

      topbarTitle.textContent = 'Agenda';
      topbarSub.textContent = 'Passeios marcados a partir de hoje';

      topbarTitle.textContent = 'Clientes';
      topbarSub.textContent = 'Tutores e cães cadastrados';
      renderClientes();
    } else {
      topbarTitle.textContent = 'Planos';
      topbarSub.textContent = 'Links de assinatura pra oferecer aos clientes';
      renderPlanos();
    }
  }
  navButtons.forEach(btn=>{
    btn.addEventListener('click', ()=> setView(btn.dataset.view));
  });

  /* ---------- FAB ---------- */
  document.getElementById('fab').addEventListener('click', ()=>{
    if(currentView === 'agenda') openNovoPasseio();
    else if(currentView === 'clientes') openNovoCliente();
    else openNovoPlano();
  });

  /* ---------- Configurações ---------- */
  document.getElementById('config-btn').addEventListener('click', openConfigSheet);
  async function openConfigSheet(){
    const cfg = await Config.get().catch(()=> ({}));
    openSheet(`
      <h2>Configurações</h2>
      <label>Seu WhatsApp (com DDD)</label>
      <input type="tel" id="f-cfg-whats" value="${esc(cfg.whatsapp)}" placeholder="(51) 9....-....">
      <label class="checkbox-row" style="margin-top:14px;"><input type="checkbox" id="f-cfg-mostrar" ${cfg.mostrarWhatsapp ? 'checked' : ''}> Mostrar botão de WhatsApp pro cliente</label>
      <div class="hint">Quando ativo, aparece um botão "WhatsApp Passeador" no painel do cliente, antes dos planos</div>
      <div class="sheet-actions">
        <button class="btn-primary" id="save-cfg">Salvar</button>
      </div>
    `, (el)=>{
      el.querySelector('#save-cfg').addEventListener('click', async ()=>{
        await Config.save({
          whatsapp: el.querySelector('#f-cfg-whats').value.trim(),
          mostrarWhatsapp: el.querySelector('#f-cfg-mostrar').checked,
        });
        closeSheet();
      });
    });
  }

  /* ================= AGENDA ================= */
  async function renderAgenda(){
    const [walks, clients, dogs] = await Promise.all([Walks.all(), Clients.all(), Dogs.all()]);
    const clientMap = Object.fromEntries(clients.map(c=>[c.id,c]));
    const dogMap = Object.fromEntries(dogs.map(d=>[d.id,d]));
    const today = todayStr();
    const upcoming = walks
      .filter(w => w.status !== 'cancelado' && w.date >= today)
      .sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));

    if(upcoming.length === 0){
      views.agenda.innerHTML = `
        <div class="empty-state">
          <span class="glyph">🐾</span>
          <p>Nenhum passeio agendado ainda.<br>Toque em <strong>+</strong> para marcar o primeiro.</p>
        </div>`;
      return;
    }

    const byDate = {};
    upcoming.forEach(w=>{ (byDate[w.date] = byDate[w.date] || []).push(w); });

    let html = '';
    Object.keys(byDate).sort().forEach(date=>{
      html += `<div class="day-group">
        <div class="day-head"><span class="label">${dayLabel(date)}</span><span class="rule"></span></div>
        <ul class="walks-list">`;
      byDate[date].forEach(w=>{
        const dog = dogMap[w.dogId];
        const client = clientMap[w.clientId];
        const statusClass = w.status === 'concluido' ? 'status-concluido' : (w.status === 'cancelado' ? 'status-cancelado' : '');
        const pill = w.status === 'concluido' ? `<span class="status-pill concluido">Concluído${w.hasPhoto ? ' 📷' : ''}</span>` : w.status === 'em_andamento' ? '<span class="status-pill concluido">📍 Em andamento</span>' : '<span class="status-pill">Agendado</span>';
        html += `<li class="walk-card ${statusClass}" data-id="${w.id}">
          <div class="walk-top">
            <div>

  async function openNovoPasseio(){
    const clients = await Clients.all();
    if(clients.length === 0){
      openSheet(`
        <h2>Novo passeio</h2>
        <p class="hint">Você ainda não tem clientes cadastrados. Cadastre um cliente e o cão dele primeiro.</p>
        <div class="sheet-actions">
          <button class="btn-primary" id="go-clientes">Cadastrar cliente</button>
        </div>
      `, (el)=>{
        el.querySelector('#go-clientes').addEventListener('click', ()=>{
          closeSheet(); setView('clientes'); openNovoCliente();
        });
      });
      return;
    }

    const options = clients.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');
    openSheet(`
      <h2>Novo passeio</h2>
      <label>Cliente</label>
      <select id="f-cliente"><option value="">Selecione</option>${options}</select>
      <div id="cliente-bairro-info"></div>

      <label>Cão</label>
      <select id="f-cao" disabled><option value="">Selecione o cliente primeiro</option></select>

      <label>Data</label>
      <input type="date" id="f-data" value="${todayStr()}">

      <label>Horário</label>
      <input type="time" id="f-hora" value="09:00">
      <div id="conflito-info"></div>

      <label class="checkbox-row"><input type="checkbox" id="f-repetir"> Repetir semanalmente</label>
      <div id="f-semanas-wrap" style="display:none;">
        <label>Por quantas semanas (incluindo esta)</label>
        <input type="number" id="f-semanas" min="2" max="12" value="4">
      </div>

      <div class="field-error" id="f-error">Selecione cliente, cão, data e horário.</div>
      <div class="sheet-actions">
        <button class="btn-primary" id="save-passeio">Agendar</button>
      </div>
    `, (el)=>{
      const selCliente = el.querySelector('#f-cliente');
      const selCao = el.querySelector('#f-cao');
      const chkRepetir = el.querySelector('#f-repetir');
      const semanasWrap = el.querySelector('#f-semanas-wrap');

      selCliente.addEventListener('change', async ()=>{
        const cid = selCliente.value;
        const bairroInfo = el.querySelector('#cliente-bairro-info');
        if(!cid){
          selCao.innerHTML = '<option value="">Selecione o cliente primeiro</option>'; selCao.disabled = true;
          bairroInfo.innerHTML = '';
          return;
        }
        const clienteSel = clients.find(c=>c.id===cid);
        bairroInfo.innerHTML = clienteSel && clienteSel.bairro
          ? `<div class="hint">📍 Bairro: ${esc(clienteSel.bairro)}</div>`
          : `<div class="hint">Bairro não informado pra este cliente</div>`;
        const dogs = await Dogs.byClient(cid);
        if(dogs.length === 0){
          selCao.innerHTML = '<option value="">Este cliente não tem cão cadastrado</option>';
          selCao.disabled = true;
        } else {
          selCao.innerHTML = '<option value="">Selecione</option>' + dogs.map(d=>`<option value="${d.id}">${esc(d.nome)}</option>`).join('');
          selCao.disabled = false;
        }
      });

      chkRepetir.addEventListener('change', ()=>{
        semanasWrap.style.display = chkRepetir.checked ? 'block' : 'none';
      });

      async function checkConflito(){
        const date = el.querySelector('#f-data').value;
        const time = el.querySelector('#f-hora').value;
        const infoEl = el.querySelector('#conflito-info');
        if(!date || !time){ infoEl.innerHTML = ''; return; }
        const [allWalks, allDogs, allClients] = await Promise.all([Walks.all(), Dogs.all(), Clients.all()]);
        const existentes = allWalks.filter(w=> w.date===date && w.time===time && w.status==='agendado');
        if(existentes.length === 0){ infoEl.innerHTML = ''; return; }
        const dogMap = Object.fromEntries(allDogs.map(d=>[d.id,d]));
        const clientMap = Object.fromEntries(allClients.map(c=>[c.id,c]));
        const linhas = existentes.map(w=>{
          const dg = dogMap[w.dogId];
          const cl = clientMap[w.clientId];
          const grupo = dg && dg.aceitaGrupo === false ? 'só individual' : 'aceita grupo';
          const bairro = cl && cl.bairro ? cl.bairro : 'bairro não informado';
          return `${dg ? esc(dg.nome) : '?'} (${grupo}, bairro: ${esc(bairro)})`;
        }).join(', ');
        infoEl.innerHTML = `<div class="hint">⚠️ Já tem passeio nesse horário: ${linhas}</div>`;
      }
      el.querySelector('#f-data').addEventListener('change', checkConflito);
      el.querySelector('#f-hora').addEventListener('change', checkConflito);

      el.querySelector('#save-passeio').addEventListener('click', async ()=>{
        const clientId = selCliente.value;
        const dogId = selCao.value;
        const date = el.querySelector('#f-data').value;
        const time = el.querySelector('#f-hora').value;
        const errorEl = el.querySelector('#f-error');
        if(!clientId || !dogId || !date || !time){
          errorEl.classList.add('show');
          return;
        }
        errorEl.classList.remove('show');

        const weeks = chkRepetir.checked ? Math.max(2, Number(el.querySelector('#f-semanas').value) || 4) : 1;
        for(let i=0;i<weeks;i++){
          await Walks.add({
            clientId, dogId,
            date: addDays(date, i*7),
            time,
            status: 'agendado',
            createdAt: Date.now()
          });
        }
        closeSheet();
        renderAgenda();
      });
    });
  }

          ${w.status === 'agendado' ? '<button class="btn-secondary" id="iniciar-btn">📍 Iniciar passeio (ativar GPS)</button>' : ''}

              if(img) img.src = URL.createObjectURL(blob);

          }).catch(()=>{});

        const gcalBtn = el.querySelector('#add-gcal-btn');
        gcalBtn.addEventListener('click', async ()=>{
          gcalBtn.disabled = true;
          gcalBtn.textContent = 'Conectando...';

            await criarEventoGoogleAgenda(w, dg, c);

            gcalBtn.textContent = '📅 Adicionar ao Google Agenda';
          }
        });
        const iniciarBtn = el.querySelector('#iniciar-btn');
        if(iniciarBtn) iniciarBtn.addEventListener('click', async ()=>{
          iniciarBtn.disabled = true;
          iniciarBtn.textContent = 'Ativando GPS...';
          try{
            w.status = 'em_andamento';
            await Walks.put(w);
            await iniciarRastreio(w.id);
            closeSheet();
            renderAgenda();

            console.error('Erro ao iniciar rastreio:', err);

          if(confirm('Excluir este passeio?')){
            await Walks.del(w.id); closeSheet(); renderAgenda();
          }
        });
      });

  async function renderClientes(){
    const clients = await Clients.all();
    if(clients.length === 0){
      views.clientes.innerHTML = `
        <div class="empty-state">
          <span class="glyph">🐕</span>
          <p>Nenhum cliente cadastrado ainda.<br>Toque em <strong>+</strong> para adicionar o primeiro.</p>
        </div>`;
      return;
    }
    const allDogs = await Dogs.all();
    const allWalks = await Walks.all();
    const unseenByClient = new Set();
    allWalks.forEach(w=>{ if(w.avaliacao && w.avaliacao.visto === false) unseenByClient.add(w.clientId); });
    const byBairro = {};
    clients.forEach(c=>{
      const key = (c.bairro || '').trim() || 'Sem bairro definido';
      (byBairro[key] = byBairro[key] || []).push(c);
    });
    const bairros = Object.keys(byBairro).sort((a,b)=>{
      if(a === 'Sem bairro definido') return 1;
      if(b === 'Sem bairro definido') return -1;
      return a.localeCompare(b, 'pt-BR');
    });

    let html = '';
    bairros.forEach(bairro=>{
      const group = byBairro[bairro].sort((a,b)=> a.nome.localeCompare(b.nome, 'pt-BR'));
      html += `<div class="day-group">
        <div class="day-head"><span class="label">${esc(bairro)}</span><span class="rule"></span></div>`;
      group.forEach(c=>{
        const dogCount = allDogs.filter(d=>d.clientId===c.id).length;
        html += `<div class="client-card" data-id="${c.id}">
          <div class="client-head">
            <div style="display:flex;align-items:center;gap:12px;">
              <div class="client-avatar">${esc(c.nome).trim().charAt(0).toUpperCase() || '?'}</div>
              <div>
                <div class="client-name">${esc(c.nome)}</div>
                <div class="client-sub">${c.telefone ? `<a class="addr-link" href="${whatsappLink(c.telefone)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">💬 ${esc(c.telefone)}</a>` : 'Sem telefone'}</div>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
              <span class="dog-badge">${dogCount} 🐾</span>
              ${vencimentoBadge(c)}
              ${unseenByClient.has(c.id) ? '<span class="status-pill concluido">⭐ Nova avaliação</span>' : ''}
            </div>
          </div>
          <div class="client-dogs" hidden></div>
        </div>`;
      });
      html += `</div>`;
    });
    views.clientes.innerHTML = html;

    views.clientes.querySelectorAll('.client-card').forEach(card=>{
      const head = card.querySelector('.client-head');
      const body = card.querySelector('.client-dogs');
      head.addEventListener('click', async ()=>{
        const isHidden = body.hasAttribute('hidden');
        views.clientes.querySelectorAll('.client-dogs').forEach(b=> b.setAttribute('hidden',''));
        if(isHidden){
          body.removeAttribute('hidden');
          await renderClientDogs(card.dataset.id, body);
        }
      });
    });
  }

  async function renderClientDogs(clientId, container){
    const [client, dogs, allWalks] = await Promise.all([Clients.all(), Dogs.byClient(clientId), Walks.all()]);
    const c = client.find(x=>x.id===clientId);
    const avaliacoes = allWalks.filter(w=> w.clientId===clientId && w.avaliacao);
    const temNova = avaliacoes.some(w=> w.avaliacao.visto === false);
    const historicoCliente = allWalks.filter(w=> w.clientId===clientId && (w.status==='concluido' || w.status==='cancelado'));
    let html = `<div class="client-info">
      <div class="info-row">📍 ${c.endereco ? `<a class="addr-link" href="${addressLink(c)}" target="_blank" rel="noopener">${esc(c.endereco)}</a>` : '<span class="hint">Endereço não informado</span>'}</div>
      <div class="info-row">✉️ ${c.email ? esc(c.email) : '<span class="hint">E-mail não informado</span>'}</div>
    </div>`;
    if(dogs.length === 0){
      html += `<p class="hint">Nenhum cão cadastrado para este cliente.</p>`;
    } else {
      dogs.forEach(d=>{
        html += `<div class="dog-chip" data-dog-id="${d.id}">
          <div>
            <div>${esc(d.nome)}</div>
            <div class="dog-meta">${esc(d.raca) || 'Raça não informada'} · ${d.aceitaGrupo === false ? 'Só passeio individual' : 'Aceita passear em grupo'}</div>
          </div>
          <div class="dog-actions">
            <button class="btn-ghost danger del-dog">Excluir</button>
          </div>
        </div>`;
      });
    }
    html += `<div class="client-actions">
      <button class="btn-secondary add-dog-btn">+ Adicionar cão</button>
    </div>
    <div class="client-actions">
      <button class="btn-ghost ver-historico-btn">${temNova ? '⭐ ' : ''}Histórico e avaliações (${historicoCliente.length})</button>
    </div>
    <div class="client-actions">
      <button class="btn-ghost edit-client-btn">Editar cliente</button>
      <button class="btn-ghost danger del-client-btn">Excluir cliente</button>
    </div>`;
    container.innerHTML = html;

    container.querySelector('.ver-historico-btn').addEventListener('click', ()=> openHistoricoCliente(c, historicoCliente));
    container.querySelector('.add-dog-btn').addEventListener('click', ()=> openNovoCao(clientId, c.nome));
    container.querySelector('.edit-client-btn').addEventListener('click', ()=> openEditCliente(c));
    container.querySelector('.del-client-btn').addEventListener('click', async ()=>{
      if(confirm(`Excluir ${c.nome} e todos os cães e passeios vinculados?`)){
        await deleteClientCascade(clientId);
        renderClientes();
      }
    });
    container.querySelectorAll('.del-dog').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        const dogId = e.target.closest('.dog-chip').dataset.dogId;
        if(confirm('Excluir este cão e os passeios agendados dele?')){
          await deleteDogCascade(dogId);
          renderClientDogs(clientId, container);
          renderClientes();
        }
      });
    });
  }

  async function openHistoricoCliente(c, walks){

    const dogMap = Object.fromEntries(allDogs.map(d=>[d.id,d]));
    const ordenados = walks.slice().sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));

    function itemHtml(w){
      const dg = dogMap[w.dogId];
      if(w.status === 'cancelado'){
        return `<div class="client-info" style="margin-bottom:10px;">
          <div class="info-row"><strong>${dayLabel(w.date)} às ${w.time}</strong> — ${esc(dg ? dg.nome : '')}</div>
          <div class="info-row">🚫 Passeio cancelado</div>
        </div>`;
      }
      const rep = w.report || {};
      const avaliacaoHtml = w.avaliacao ? `
        <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line);">
          <div class="info-row" style="font-weight:600;">Avaliação do cliente</div>
          <div class="info-row" style="font-size:18px;letter-spacing:2px;color:var(--ochre);">${'★'.repeat(w.avaliacao.nota)}${'☆'.repeat(5 - w.avaliacao.nota)}</div>
          ${w.avaliacao.comentario ? `<div class="info-row">💬 ${esc(w.avaliacao.comentario)}</div>` : ''}
        </div>` : '';
      return `<div class="client-info" style="margin-bottom:10px;">
        <div class="info-row"><strong>${dayLabel(w.date)} às ${w.time}</strong> — ${esc(dg ? dg.nome : '')}</div>
        <div class="info-row">${rep.xixi ? '💧 Fez xixi' : '💧 Não fez xixi'}</div>
        <div class="info-row">${rep.coco ? '💩 Fez cocô' : '💩 Não fez cocô'}</div>
        ${rep.comportamento ? `<div class="info-row">🐾 ${esc(rep.comportamento)}</div>` : ''}
        ${rep.observacoes ? `<div class="info-row">📝 ${esc(rep.observacoes)}</div>` : ''}
        ${avaliacaoHtml}
      </div>`;
    }

    let html = `<h2>Histórico de ${esc(c.nome)}</h2>`;
    if(ordenados.length === 0){
      html += `<p class="hint">Nenhum passeio no histórico ainda.</p>`;
    } else {
      html += itemHtml(ordenados[0]);
      const rest = ordenados.slice(1);
      const byMonth = {};
      rest.forEach(w=>{
        const key = w.date.slice(0,7);
        (byMonth[key] = byMonth[key] || []).push(w);
      });
      Object.keys(byMonth).sort((a,b)=> b.localeCompare(a)).forEach(key=>{
        html += `<div class="month-group">
          <button class="month-toggle" data-month="${key}">${monthLabel(key)} (${byMonth[key].length}) <span class="chev">▾</span></button>
          <div class="month-items" hidden>
            ${byMonth[key].map(w=> itemHtml(w)).join('')}
          </div>
        </div>`;
      });
    }
    openSheet(html, (el)=>{
      el.querySelectorAll('.month-toggle').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const items = btn.nextElementSibling;
          const isHidden = items.hasAttribute('hidden');
          if(isHidden){ items.removeAttribute('hidden'); btn.classList.add('open'); }
          else{ items.setAttribute('hidden',''); btn.classList.remove('open'); }
        });
      });
    });

    const naoVistas = walks.filter(w=> w.avaliacao && w.avaliacao.visto === false);
    for(const w of naoVistas){
      await Walks.put({ ...w, avaliacao: { ...w.avaliacao, visto: true } });
    }
    if(naoVistas.length){ renderClientes(); }
  }

      html += `

          <p>Nenhum plano cadastrado ainda.<br>Toque em <strong>+</strong> pra adicionar um plano (com os links de assinatura criados na InfinitePay).</p>
        </div>`;
    } else {
      planos.forEach(p=>{
        const variantes = p.variantes && p.variantes.length ? p.variantes : (p.preco ? [{duracao:'', preco:p.preco, link:p.link}] : []);
        html += `<div class="client-card" data-id="${p.id}">
          <div class="client-head" style="cursor:default;">
            <div>
              <div class="client-name">${esc(p.nome)}</div>

            ${p.descricao ? `<div class="info-row">${esc(p.descricao)}</div>` : ''}
            ${variantes.map(v=>`<div class="info-row">⏱️ ${v.duracao ? esc(v.duracao)+' — ' : ''}${esc(v.preco)}</div>`).join('')}
            <div class="client-actions">
              <button class="btn-ghost edit-plano-btn">Editar</button>
              <button class="btn-ghost danger del-plano-btn">Excluir</button>
            </div>
          </div>
        </div>`;
      });
    }

    html += `<div class="day-head" style="margin-top:26px;"><span class="label">Passeios avulsos</span><span class="rule"></span></div>`;
    if(avulsos.length === 0){
      html += `<p class="hint">Nenhum avulso cadastrado ainda.</p>`;
    } else {
      avulsos.forEach(a=>{
        html += `<div class="client-card" data-avulso-id="${a.id}">
          <div class="client-head" style="cursor:default;">
            <div>
              <div class="client-name">${esc(a.duracao)}</div>

            <span class="dog-badge">${a.ativo === false ? 'Inativo' : 'Ativo'}</span>

          <div class="client-dogs" style="padding:0 16px 16px 16px;">
            <div class="client-actions">
              <button class="btn-ghost edit-avulso-btn">Editar</button>
              <button class="btn-ghost danger del-avulso-btn">Excluir</button>
            </div>
          </div>
        </div>`;
      });
    }
    html += `<button class="btn-secondary" id="add-avulso-btn" style="margin-top:10px;">+ Adicionar avulso</button>`;

    views.planos.innerHTML = html;

    views.planos.querySelectorAll('.client-card[data-id]').forEach(card=>{
      const id = card.dataset.id;
      const p = planos.find(x=>x.id===id);
      card.querySelector('.edit-plano-btn').addEventListener('click', ()=> openEditPlano(p));
      card.querySelector('.del-plano-btn').addEventListener('click', async ()=>{
        if(confirm(`Excluir o plano "${p.nome}"?`)){
          await Planos.del(p.id);
          renderPlanos();
        }
      });
    });
    views.planos.querySelectorAll('.client-card[data-avulso-id]').forEach(card=>{
      const id = card.dataset.avulsoId;
      const a = avulsos.find(x=>x.id===id);
      card.querySelector('.edit-avulso-btn').addEventListener('click', ()=> openEditAvulso(a));
      card.querySelector('.del-avulso-btn').addEventListener('click', async ()=>{
        if(confirm(`Excluir o avulso "${a.duracao}"?`)){
          await Avulsos.del(a.id);
          renderPlanos();
        }
      });
    });

  /* ---------- Visão do cliente (somente leitura) ---------- */
  async function renderClientView(email){
    const viewPasseios = document.getElementById('client-view-passeios');
    const viewHistorico = document.getElementById('client-view-historico');
    viewPasseios.innerHTML = '<div class="empty-state"><p>Carregando...</p></div>';
    viewHistorico.innerHTML = '';
    try{
      const snap = await getDocs(query(colRef('clients'), where('email','==', email)));
      if(snap.empty){
        viewPasseios.innerHTML = '<div class="empty-state"><p>Não encontramos seu cadastro. Fale com o seu passeador.</p></div>';
        return;
      }
      const clientDoc = snap.docs[0];
      const client = { id: clientDoc.id, ...clientDoc.data() };

      const [dogsSnap, walksSnap, planosSnap, avulsosSnap, config] = await Promise.all([
        getDocs(query(colRef('dogs'), where('clientId','==', client.id))),
        getDocs(query(colRef('walks'), where('clientId','==', client.id))),
        getDocs(colRef('planos')),
        getDocs(colRef('avulsos')),
        Config.get().catch(()=> ({}))
      ]);
      const dogs = dogsSnap.docs.map(d=>({id:d.id, ...d.data()}));
      const walks = walksSnap.docs.map(d=>({id:d.id, ...d.data()}));
      const planos = planosSnap.docs.map(d=>({id:d.id, ...d.data()})).filter(p=> p.ativo !== false);
      const avulsos = avulsosSnap.docs.map(d=>({id:d.id, ...d.data()})).filter(a=> a.ativo !== false);
      const dogMap = Object.fromEntries(dogs.map(d=>[d.id,d]));

      const today = todayStr();
      const now = new Date();
      const monthStart = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
      const lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
      const monthEnd = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
      const doMes = walks
        .filter(w=> w.status==='agendado' && w.date>=today && w.date<=monthEnd)
        .sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
      const historico = walks
        .filter(w=> w.status==='concluido' || w.status==='cancelado')
        .sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));

      const unseenWalks = historico.filter(w=> w.vistoPeloCliente === false);
      unseenHistoricoIds = unseenWalks.map(w=>w.id);
      const historicoBadge = document.getElementById('historico-badge');
      if(unseenWalks.length > 0){ historicoBadge.textContent = String(unseenWalks.length); historicoBadge.hidden = false; }
      else{ historicoBadge.hidden = true; }

      const dogNames = dogs.map(d=>esc(d.nome)).join(', ') || 'Nenhum cão cadastrado ainda';

      function ratingHtml(w){
        if(w.avaliacao){
          const stars = '★'.repeat(w.avaliacao.nota) + '☆'.repeat(5 - w.avaliacao.nota);
          return `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">
            <div class="info-row" style="font-weight:600;">Sua avaliação</div>
            <div class="info-row" style="font-size:18px;letter-spacing:2px;color:var(--ochre);">${stars}</div>
            ${w.avaliacao.comentario ? `<div class="info-row freetext">💬 ${esc(w.avaliacao.comentario)}</div>` : ''}
          </div>`;
        }
        return `<div class="rate-block" data-walk-id="${w.id}" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">
          <label>Avaliar este passeio</label>
          <select class="rate-nota">
            <option value="5">★★★★★</option>
            <option value="4">★★★★☆</option>
            <option value="3">★★★☆☆</option>
            <option value="2">★★☆☆☆</option>
            <option value="1">★☆☆☆☆</option>
          </select>
          <textarea class="rate-comment freetext" placeholder="Comentário (opcional)"></textarea>
          <button class="btn-secondary rate-submit" style="margin-top:8px;">Enviar avaliação</button>
        </div>`;
      }

      function entryHtml(w){
        const dg = dogMap[w.dogId];
        if(w.status === 'cancelado'){
          return `<div class="client-info" style="margin-bottom:12px;">
            <div class="info-row"><strong>${dayLabel(w.date)} às ${w.time}</strong> — ${esc(dg ? dg.nome : '')}</div>
            <div class="info-row">🚫 Passeio cancelado</div>
          </div>`;
        }
        const rep = w.report || {};
        return `<div class="client-info" style="margin-bottom:12px;">
          <div class="info-row"><strong>${dayLabel(w.date)} às ${w.time}</strong> — ${esc(dg ? dg.nome : '')}</div>
          <div class="info-row">${rep.xixi ? '💧 Fez xixi' : '💧 Não fez xixi'}</div>
          <div class="info-row">${rep.coco ? '💩 Fez cocô' : '💩 Não fez cocô'}</div>
          ${rep.comportamento ? `<div class="info-row">🐾 ${esc(rep.comportamento)}</div>` : ''}
          ${rep.observacoes ? `<div class="info-row freetext">📝 ${esc(rep.observacoes)}</div>` : ''}
          ${ratingHtml(w)}
        </div>`;
      }

      /* ---- Aba Passeios (resumo + deste mês + planos) ---- */
      let htmlP = `<div class="client-info"><div class="info-row">🐾 ${dogNames}</div></div>`;

      const emAndamento = walks.find(w=> w.status === 'em_andamento');
      if(emAndamento){
        const dg = dogMap[emAndamento.dogId];
        htmlP += `<div class="renew-banner" style="background:var(--pine);color:#fff;">
          <div class="info-row" style="color:#fff;">📍 Passeio em andamento agora — ${esc(dg ? dg.nome : '')}</div>
          ${emAndamento.location
            ? `<div id="live-map"></div><div class="info-row hint" id="live-map-updated" style="color:#EDEAE2;"></div>`
            : `<div class="info-row hint" style="color:#EDEAE2;">Aguardando a primeira localização...</div>`}
        </div>`;
      }

      const dias = diasParaVencer(client.planoVencimento);
      if(dias !== null && dias <= 5){
        const msg = dias < 0 ? 'Seu plano venceu.' : dias === 0 ? 'Seu plano vence hoje.' : `Seu plano vence em ${dias} dia${dias>1?'s':''}.`;
        htmlP += `<div class="renew-banner">
          <div class="info-row">⚠️ ${msg}</div>
          <button class="btn-primary" id="renovar-btn" style="margin-top:8px;">Renovar plano</button>
        </div>`;
      }

      htmlP += `<h2 style="margin-top:22px;margin-bottom:10px;">Passeios deste mês</h2>`;
      if(doMes.length === 0){
        htmlP += `<div class="empty-state"><p>Nenhum passeio agendado neste mês ainda.</p></div>`;
      } else {
        htmlP += `<div class="month-walks-grid">`;
        doMes.forEach(w=>{
          const dg = dogMap[w.dogId];
          htmlP += `<div class="walk-card walk-card-compact">
            <div class="walk-time">${w.time}</div>
            <div class="walk-dog">${esc(dg ? dg.nome : '')}</div>
            <div class="walk-client">${dayLabel(w.date)}</div>
          </div>`;
        });
        htmlP += `</div>`;
      }

      htmlP += `<div id="planos-section">`;
      if(config.mostrarWhatsapp && config.whatsapp){
        htmlP += `<a class="btn-primary" style="display:block;text-decoration:none;margin:20px 0;" href="${whatsappLink(config.whatsapp)}" target="_blank" rel="noopener">WhatsApp Passeador</a>`;
      }
      htmlP += `<h2 style="margin-top:6px;margin-bottom:10px;">Planos disponíveis</h2>`;
      if(planos.length === 0){
        htmlP += `<div class="empty-state"><p>Nenhum plano disponível no momento.</p></div>`;
      } else {
        planos.forEach(p=>{
          const variantes = p.variantes && p.variantes.length ? p.variantes : (p.preco ? [{duracao:'', preco:p.preco, link:p.link}] : []);
          htmlP += `<div class="client-info" style="margin-bottom:14px;">
            <div class="info-row"><strong>${esc(p.nome)}</strong></div>
            ${p.frequencia ? `<div class="info-row">${esc(p.frequencia)}</div>` : ''}
            ${p.descricao ? `<div class="info-row freetext">${esc(p.descricao)}</div>` : ''}
            ${variantes.map(v=>`
              <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">
                <div class="info-row">⏱️ ${v.duracao ? esc(v.duracao)+' — ' : ''}${esc(v.preco)}</div>
                <a class="btn-primary" style="display:block;text-align:center;text-decoration:none;margin-top:6px;" href="${esc(v.link)}" target="_blank" rel="noopener">Assinar ${esc(v.duracao)}</a>
              </div>`).join('')}
          </div>`;
        });
      }
      htmlP += `</div>`;

      if(avulsos.length > 0){
        htmlP += `<h2 style="margin-top:26px;margin-bottom:10px;">Passeios avulsos</h2>`;
        htmlP += `<p class="hint">Depois de pagar, combine a data e o horário direto com o passeador</p>`;
        avulsos.forEach(a=>{
          htmlP += `<div class="client-info" style="margin-bottom:12px;">
            <div class="info-row"><strong>${esc(a.duracao)}</strong> — ${esc(a.preco)}</div>
            <a class="btn-primary" style="display:block;text-align:center;text-decoration:none;margin-top:6px;" href="${esc(a.link)}" target="_blank" rel="noopener">Pagar e agendar</a>
          </div>`;
        });
      }

      viewPasseios.innerHTML = htmlP;

      const renovarBtn = document.getElementById('renovar-btn');
      if(renovarBtn){
        renovarBtn.addEventListener('click', ()=>{
          document.getElementById('planos-section').scrollIntoView({behavior:'smooth'});
        });
      }

      if(emAndamento){
        initLiveMap(emAndamento).catch(err=> console.error('Erro ao iniciar mapa ao vivo:', err));
      }

      /* ---- Aba Histórico ---- */
      let htmlH = `<h2 style="margin-top:10px;margin-bottom:10px;">Histórico</h2>`;
      if(historico.length === 0){
        htmlH += `<div class="empty-state"><p>Ainda não há passeios no histórico.</p></div>`;
      } else {
        htmlH += entryHtml(historico[0]);
        const rest = historico.slice(1);
        const byMonth = {};
        rest.forEach(w=>{
          const key = w.date.slice(0,7);
          (byMonth[key] = byMonth[key] || []).push(w);
        });
        Object.keys(byMonth).sort((a,b)=> b.localeCompare(a)).forEach(key=>{
          htmlH += `<div class="month-group">
            <button class="month-toggle" data-month="${key}">${monthLabel(key)} (${byMonth[key].length}) <span class="chev">▾</span></button>
            <div class="month-items" hidden>
              ${byMonth[key].map(w=> entryHtml(w)).join('')}
            </div>
          </div>`;
        });
      }
      viewHistorico.innerHTML = htmlH;

      viewHistorico.querySelectorAll('.month-toggle').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const items = btn.nextElementSibling;
          const isHidden = items.hasAttribute('hidden');
          if(isHidden){ items.removeAttribute('hidden'); btn.classList.add('open'); }
          else{ items.setAttribute('hidden',''); btn.classList.remove('open'); }
        });
      });

      viewHistorico.querySelectorAll('.rate-submit').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const block = btn.closest('.rate-block');
          const walkId = block.dataset.walkId;
          const nota = Number(block.querySelector('.rate-nota').value);
          const comentario = block.querySelector('.rate-comment').value.trim();
          btn.disabled = true;
          btn.textContent = 'Enviando...';
          try{
            await submitAvaliacao(walkId, { nota, comentario, criadoEm: Date.now(), visto: false });
            renderClientView(email);
          }catch(err){
            console.error('Erro ao enviar avaliação:', err);
            btn.disabled = false;
            btn.textContent = 'Enviar avaliação';
          }
        });
      });
    }catch(err){
      console.error('Erro ao carregar visão do cliente:', err);
      viewPasseios.innerHTML = '<div class="empty-state"><p>Não foi possível carregar seus dados agora. Tente de novo em alguns minutos.</p></div>';
    }
  }

  /* ---------- Autenticação (Firebase) ---------- */
  const authGate = document.getElementById('auth-gate');
  const appRoot = document.getElementById('app');
  const clientRoot = document.getElementById('client-app');
  const authEmail = document.getElementById('auth-email');
  const authPassword = document.getElementById('auth-password');
  const authError = document.getElementById('auth-error');
  const authSubmit = document.getElementById('auth-submit');
  const authToggle = document.getElementById('auth-toggle');
  const authTitle = document.getElementById('auth-title');
  let isSignup = false;
  let unseenHistoricoIds = [];
  let dbReady = false;

  function traduzErroFirebase(code){
    const map = {
      'auth/invalid-email': 'E-mail inválido.',
      'auth/user-not-found': 'Usuário não encontrado.',
      'auth/wrong-password': 'Senha incorreta.',
      'auth/invalid-credential': 'E-mail ou senha incorretos.',
      'auth/email-already-in-use': 'Já existe uma conta com esse e-mail.',
      'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
      'auth/missing-password': 'Digite uma senha.'
    };
    return map[code] || 'Não foi possível completar. Tente de novo.';
  }

  authToggle.addEventListener('click', ()=>{
    isSignup = !isSignup;
    authTitle.textContent = isSignup ? 'Criar conta' : 'Entrar';
    authSubmit.textContent = isSignup ? 'Criar conta' : 'Entrar';
    authToggle.textContent = isSignup ? 'Já tenho conta' : 'Ainda não tenho conta';
    authError.classList.remove('show');
  });

  document.getElementById('auth-google-btn').addEventListener('click', async ()=>{
    authError.classList.remove('show');
    try{
      await signInWithPopup(fbAuth, new GoogleAuthProvider());
    }catch(err){
      console.error('Erro no login com Google:', err);
      authError.textContent = 'Não foi possível entrar com Google. Tente de novo.';
      authError.classList.add('show');
    }
  });

  authSubmit.addEventListener('click', async ()=>{
    const email = authEmail.value.trim();
    const password = authPassword.value;
    authError.classList.remove('show');
    if(!email || !password){
      authError.textContent = 'Preencha e-mail e senha.';
      authError.classList.add('show');
      return;
    }
    authSubmit.disabled = true;
    try{
      if(isSignup){
        await createUserWithEmailAndPassword(fbAuth, email, password);
      } else {
        await signInWithEmailAndPassword(fbAuth, email, password);
      }
    }catch(err){
      authError.textContent = traduzErroFirebase(err.code);
      authError.classList.add('show');
    }
    authSubmit.disabled = false;
  });

  document.getElementById('logout-btn').addEventListener('click', ()=> signOut(fbAuth));
  document.getElementById('client-logout-btn').addEventListener('click', ()=> signOut(fbAuth));

  const clientNavButtons = document.querySelectorAll('#client-app .bottomnav button');
  const clientViews = {
    passeios: document.getElementById('client-view-passeios'),
    historico: document.getElementById('client-view-historico'),
  };
  clientNavButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const name = btn.dataset.cview;
      Object.entries(clientViews).forEach(([k, el])=> el.classList.toggle('active', k===name));
      clientNavButtons.forEach(b=> b.classList.toggle('active', b.dataset.cview===name));
      if(name === 'historico' && unseenHistoricoIds.length){
        const ids = unseenHistoricoIds.slice();
        unseenHistoricoIds = [];
        document.getElementById('historico-badge').hidden = true;
        ids.forEach(id=> updateDoc(docRef('walks', id), { vistoPeloCliente: true }).catch(()=>{}));
      }
    });
  });

  onAuthStateChanged(fbAuth, async (user)=>{
    if(user){
      authGate.style.display = 'none';
      if(user.uid === ADMIN_UID){
        appRoot.style.display = '';
        clientRoot.style.display = 'none';
        if(!dbReady){
          try{
            await openPhotoDB();
            dbReady = true;
            renderAgenda();
          }catch(err){
            document.getElementById('view-agenda').innerHTML =
              '<div class="empty-state"><p>Não foi possível abrir o armazenamento local de fotos neste navegador.</p></div>';
            console.error(err);
          }
        }
      } else {
        appRoot.style.display = 'none';
        clientRoot.style.display = '';
        renderClientView((user.email || '').toLowerCase());
      }
    } else {
      dbReady = false;
      authGate.style.display = 'flex';
      appRoot.style.display = 'none';
      clientRoot.style.display = 'none';
    }
  });

  if('serviceWorker' in navigator){
    // Registro real do sw.js. Enquanto testado como artefato de preview,
    // pode falhar silenciosamente; funciona quando hospedado (GitHub Pages).
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }

  setTimeout(()=>{
    const splash = document.getElementById('splash');
    if(splash){
      splash.classList.add('fade-out');
      setTimeout(()=> splash.remove(), 450);
    }
  }, 1100);
})();
</script>
</body>
</html>
